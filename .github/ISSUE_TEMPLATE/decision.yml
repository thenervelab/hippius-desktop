name: Decision
description: A yes/no or a choice is needed before work can continue
title: "Decide: "
labels: ["decision"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Drive
        - S3 Storage
        - Hub
        - Confidential Computing
        - Website
        - Console
        - Mobile
        - Docs
        - Infra
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What / Why
      description: The question, the options on the table, and what is blocked while we wait.
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who decides
      options:
        - dubs
        - Mog
        - Izori
        - dubs + Izori
        - Mog + Izori
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we know it's done
      description: Observable result. What can Izori check to confirm it works?
      placeholder: "- Go to ... and see ...\n- ... returns ..."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Mattermost thread, design, related issues or PRs.
