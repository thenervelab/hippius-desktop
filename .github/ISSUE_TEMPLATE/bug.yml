name: Bug
description: Something is broken for a user or for the team
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Drive
        - S3 Storage
        - Hub
        - Confidential Computing
        - Website
        - Console
        - Mobile
        - Docs
        - Infra
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What / Why
      description: What happens, what should happen, and why it matters (who is hit).
      placeholder: "Steps to reproduce, expected vs actual, impact."
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: How we know it's done
      description: Observable result. What can Izori check to confirm it works?
      placeholder: "- Go to ... and see ...\n- ... returns ..."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Mattermost thread, design, related issues or PRs.
