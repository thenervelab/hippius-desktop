name: publish-dev

on:
  workflow_dispatch:
  push:
    branches: [sync-engine]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  # Helps when nested actions run Cargo and need private git deps
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  publish-tauri-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ SSH setup (Fix B) for private Rust git deps (passphrase-protected key)
      - name: Setup SSH (private Rust deps)
        shell: bash
        env:
          ARION_DEPLOY_KEY_B64: ${{ secrets.ARION_DEPLOY_KEY_B64 }}
          ARION_DEPLOY_KEY_PASSPHRASE: ${{ secrets.ARION_DEPLOY_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode private key from base64
          python3 - <<'PY' > ~/.ssh/arion_key
          import os, base64, sys
          b64 = os.environ["ARION_DEPLOY_KEY_B64"].strip()
          sys.stdout.buffer.write(base64.b64decode(b64))
          PY
          chmod 600 ~/.ssh/arion_key

          # Trust GitHub host key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Start ssh-agent and persist env vars for later steps/actions
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # Askpass helper for passphrase (no prompts)
          cat > /tmp/ssh-askpass.sh <<'EOF'
          #!/bin/bash
          echo "$ARION_DEPLOY_KEY_PASSPHRASE"
          EOF
          chmod 700 /tmp/ssh-askpass.sh

          export SSH_ASKPASS=/tmp/ssh-askpass.sh
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=1

          ssh-add ~/.ssh/arion_key </dev/null
          ssh-add -l

      - name: Force Cargo to use git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Get release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          PR_NUMBER="$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | tr -d '# ' || true)"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            PR_NUMBER="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
              | jq -r '.[0].number // empty')"
          fi

          if [[ -n "${PR_NUMBER:-}" ]]; then
            PR_INFO="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")"

            TITLE="$(jq -r '.title // empty' <<<"$PR_INFO")"
            BODY="$(jq -r '.body // empty'  <<<"$PR_INFO")"
          else
            TITLE="$(git log -1 --pretty=%s)"
            BODY="$(git log -1 --pretty=%b)"
          fi

          TITLE="${TITLE//$'\r'/}"
          BODY="${BODY//$'\r'/}"
          if [[ -z "${BODY:-}" ]]; then
            BODY="See the assets to download this version and install."
          fi

          BODY="$(printf '%s' "$BODY" | head -c 30000)"

          {
            echo "title<<__TITLE__"
            echo "$TITLE"
            echo "__TITLE__"
            echo "body<<__BODY__"
            echo "$BODY"
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: PNPM cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # ✅ Pattern B: Create src-tauri/.env from a single secret (TAURI_ENV_FILE)
      - name: Create src-tauri/.env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          cat > src-tauri/.env << 'EOF'
          ${{ secrets.TAURI_ENV_FILE }}
          EOF
          chmod 600 src-tauri/.env

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          tagName: v__VERSION__-dev
          releaseName: '[DEV] ${{ steps.release_notes.outputs.title }}'
          releaseBody: |
            **⚠️ Development Build - macOS Only**

            ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          makeLatest: false
          overwrite: true
          args: '--target universal-apple-darwin'
