name: publish-dev

on:
  workflow_dispatch:
  push:
    branches: [sync-engine]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  publish-tauri-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Don't persist the GITHUB_TOKEN into .git/config (zizmor artipacked);
          # the hcfs dep uses a separate SSH deploy key and the release upload
          # uses the token via tauri-action's env, not git.
          persist-credentials: false

      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode private key from base64
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          b64 = os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()
          sys.stdout.buffer.write(base64.b64decode(b64))
          PY
          chmod 600 ~/.ssh/private_git_key

          # Trust GitHub host key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # SSH config
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          # Start ssh-agent
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # Add key (no passphrase)
          ssh-add ~/.ssh/private_git_key
          ssh-add -l

      - name: Force Cargo to use git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Verify SSH access to hcfs
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote ssh://git@github.com/thenervelab/hcfs.git HEAD

      - name: Verify pinned hcfs commit is fetchable
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          REV=$(grep -m1 'thenervelab/hcfs.git' src-tauri/Cargo.toml | sed 's/.*rev *= *"\([^"]*\)".*/\1/')
          echo "Pinned hcfs rev: $REV"
          if git ls-remote ssh://git@github.com/thenervelab/hcfs.git | grep -q "$REV"; then
            echo "Commit $REV found at remote ref"
          else
            echo "Commit not at a ref tip, verifying via shallow clone..."
            git clone --bare --filter=blob:none ssh://git@github.com/thenervelab/hcfs.git /tmp/hcfs-verify
            git -C /tmp/hcfs-verify cat-file -t "$REV"
          fi

      - name: Get release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          PR_NUMBER="$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | tr -d '# ' || true)"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            PR_NUMBER="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
              | jq -r '.[0].number // empty')"
          fi

          if [[ -n "${PR_NUMBER:-}" ]]; then
            PR_INFO="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")"

            TITLE="$(jq -r '.title // empty' <<<"$PR_INFO")"
            BODY="$(jq -r '.body // empty'  <<<"$PR_INFO")"
          else
            TITLE="$(git log -1 --pretty=%s)"
            BODY="$(git log -1 --pretty=%b)"
          fi

          TITLE="${TITLE//$'\r'/}"
          BODY="${BODY//$'\r'/}"
          if [[ -z "${BODY:-}" ]]; then
            BODY="See the assets to download this version and install."
          fi

          BODY="$(printf '%s' "$BODY" | head -c 30000)"

          {
            echo "title<<__TITLE__"
            echo "$TITLE"
            echo "__TITLE__"
            echo "body<<__BODY__"
            echo "$BODY"
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # src-tauri/rust-toolchain.toml pins the build to a specific channel
      # (1.95.0), which rustup auto-installs at first `cargo` use with ONLY the
      # host (aarch64) target. The step above only adds the Apple targets to
      # *stable*, so the universal build still can't find x86_64-apple-darwin.
      # Parse the pinned channel and add both Apple slices to *that* toolchain.
      - name: Add Apple targets to the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The pin lives in src-tauri/ (the Rust workspace); fall back to the
          # repo root in case it moves again.
          channel=""
          for f in src-tauri/rust-toolchain.toml rust-toolchain.toml; do
            if [[ -f "$f" ]]; then
              channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$f")
              echo "Pinned toolchain channel: ${channel} (from $f)"
              break
            fi
          done
          if [[ -z "$channel" ]]; then
            echo "No rust-toolchain.toml found — stable already has both targets"
            exit 0
          fi
          rustup toolchain install "${channel}" --no-self-update
          rustup target add --toolchain "${channel}" aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: PNPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create src-tauri/.env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          cat > src-tauri/.env << 'EOF'
          ${{ secrets.TAURI_ENV_FILE }}
          EOF
          chmod 600 src-tauri/.env

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Build & publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          tagName: v__VERSION__-dev
          releaseName: '[DEV] ${{ steps.release_notes.outputs.title }}'
          releaseBody: |
            **⚠️ Development Build - macOS Only**

            ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          makeLatest: false
          overwrite: true
          args: '--target universal-apple-darwin'