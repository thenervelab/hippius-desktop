name: publish-beta

# The public opt-in lane, between staging and main. Users reach it from
# "Explore Beta" in the app, which installs this lane's build and restarts.
#
# Versions carry a prerelease suffix (0.5.0-beta.N) so semver orders the lanes
# without help: 0.4.0 < 0.5.0-beta.1 < 0.5.0. A beta build is therefore an
# upgrade from production, and promoting beta as 0.5.0 supersedes every
# 0.5.0-beta.N in the fleet. The tag needs no suffix of its own — the version
# already carries one.
#
# Updater: every lane signs with the one TAURI_SIGNING_PRIVATE_KEY, and
# tauri.conf.json carries the matching pubkey on every branch, so there is no
# build-time key patch and no branch-specific pubkey to carry across a merge.
#
# Unlike staging, this lane MUST publish a working manifest: `publish-manifest`
# below merges the macOS entry into latest.json and republishes it to the fixed
# `beta` tag. That fixed tag is the whole reason the job exists — every beta
# release carries its own version tag, and GitHub's `releases/latest` resolves
# only to a NON-prerelease, so neither gives the updater a stable URL to check.

on:
  workflow_dispatch:
  push:
    branches: [beta]
    # Keep in sync with tauri-build.yml — see the rationale there. Denylist on
    # purpose: an unrecognized path still builds, so forgetting an entry costs
    # one wasted build rather than a beta DMG that silently never ships.
    # `workflow_dispatch` ignores path filters and stays the manual escape hatch.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - ".vscode/**"
      - ".gitignore"
      - ".git-blame-ignore-revs"

# Least privilege by default; the three publishing jobs re-grant `contents:
# write` individually, because each creates or uploads to a release. Granting
# write workflow-wide meant every job — including the build-only steps that run
# untrusted-ish dependency code — carried the token that can rewrite the repo.
permissions:
  contents: read

concurrency:
  group: publish-beta-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  publish-tauri-macos:
    runs-on: macos-latest
    # Creates the beta release and uploads artifacts to it. `pull-requests:
    # read` is for the release-notes step, which queries the PR API — without it
    # the title resolves empty and, on a push with no `#N` in the subject, `jq`
    # exits non-zero and fails the step under `set -euo pipefail`.
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Nothing here pushes over git — the release uploads go through `gh`
          # with an explicit GH_TOKEN — so leaving the credential in .git/config
          # only widens what a compromised build step could reach.
          persist-credentials: false

      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode private key from base64
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          b64 = os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()
          sys.stdout.buffer.write(base64.b64decode(b64))
          PY
          chmod 600 ~/.ssh/private_git_key

          # Trust GitHub host key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # SSH config
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          # Start ssh-agent
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # Add key (no passphrase)
          ssh-add ~/.ssh/private_git_key
          ssh-add -l

      - name: Force Cargo to use git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Verify SSH access to hcfs
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote ssh://git@github.com/thenervelab/hcfs.git HEAD

      - name: Verify pinned hcfs commit is fetchable
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          REV=$(grep -m1 'thenervelab/hcfs.git' src-tauri/Cargo.toml | sed 's/.*rev *= *"\([^"]*\)".*/\1/')
          echo "Pinned hcfs rev: $REV"
          if git ls-remote ssh://git@github.com/thenervelab/hcfs.git | grep -q "$REV"; then
            echo "Commit $REV found at remote ref"
          else
            echo "Commit not at a ref tip, verifying via shallow clone..."
            git clone --bare --filter=blob:none ssh://git@github.com/thenervelab/hcfs.git /tmp/hcfs-verify
            git -C /tmp/hcfs-verify cat-file -t "$REV"
          fi

      - name: Get release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          PR_NUMBER="$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | tr -d '# ' || true)"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            PR_NUMBER="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
              | jq -r '.[0].number // empty')"
          fi

          if [[ -n "${PR_NUMBER:-}" ]]; then
            PR_INFO="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")"

            TITLE="$(jq -r '.title // empty' <<<"$PR_INFO")"
            BODY="$(jq -r '.body // empty'  <<<"$PR_INFO")"
          else
            TITLE="$(git log -1 --pretty=%s)"
            BODY="$(git log -1 --pretty=%b)"
          fi

          TITLE="${TITLE//$'\r'/}"
          BODY="${BODY//$'\r'/}"
          if [[ -z "${BODY:-}" ]]; then
            BODY="See the assets to download this version and install."
          fi

          BODY="$(printf '%s' "$BODY" | head -c 30000)"

          {
            echo "title<<__TITLE__"
            echo "$TITLE"
            echo "__TITLE__"
            echo "body<<__BODY__"
            echo "$BODY"
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # rust-toolchain.toml pins the build toolchain, which rustup
      # auto-installs at first cargo use with only the host (aarch64)
      # target. A bare `rustup target add` is NOT enough: it applies to the
      # rustup *default* (stable, set by the action above), not the pinned
      # toolchain — run 27331470103 proved it ("rust-std up to date" in 0.1s
      # while the universal build still missed x86_64). Parse the pinned
      # channel and install/target it explicitly.
      - name: Add Apple targets to the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The pin lives in src-tauri/ (the Rust workspace); fall back to the
          # repo root in case it moves again.
          channel=""
          for f in src-tauri/rust-toolchain.toml rust-toolchain.toml; do
            if [[ -f "$f" ]]; then
              channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$f")
              echo "Pinned toolchain channel: ${channel} (from $f)"
              break
            fi
          done
          if [[ -z "$channel" ]]; then
            echo "No rust-toolchain.toml found — stable already has both targets"
            exit 0
          fi
          rustup toolchain install "${channel}" --no-self-update
          rustup target add --toolchain "${channel}" aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: PNPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The script fails the build when the secret carries no INDEXER_API_KEY —
      # without it the app renders indexer-backed screens as zeros rather than
      # errors, so a broken beta build looks healthy to users.
      - name: Create src-tauri/.env
        shell: bash
        env:
          TAURI_ENV_FILE: ${{ secrets.TAURI_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAURI_ENV_FILE" | bash scripts/write-tauri-env.sh

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      # macOS packaging tools for the Finder extension: xcodegen builds the
      # universal .appex; create-dmg builds the installer (the finalize step
      # owns the DMG since the extension is embedded after Tauri builds the app).
      - name: Install macOS packaging tools
        run: brew install xcodegen create-dmg

      # Apple code signing. The App Group the Finder extension needs is granted
      # only to code signed by Team V28B5X732P, so a real Developer ID cert is
      # required (the preview build was previously ad-hoc/unsigned). The CERT
      # goes to GITHUB_ENV so tauri-action signs the app; notarization is
      # withheld from tauri-action (the extension is embedded + the app re-signed
      # afterwards, which invalidates any earlier notarization) and surfaced as
      # step OUTPUTS consumed by the finalize step. Apple code signing is a
      # separate concern from the UPDATER key, which every lane now shares —
      # see the updater note at the top of this file.
      - name: Set up Apple signing
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Code signing enabled."
          else
            echo "APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY not set — building unsigned; the Finder extension will be skipped (App Groups need a real Team ID)."
          fi
          if [[ -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER_ID" ]]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
            {
              echo "api_key_path=$KEY_PATH"
              echo "api_key=$APPLE_API_KEY_ID"
              echo "api_issuer=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_OUTPUT"
            echo "Notarization enabled (finalize step)."
          else
            # HARD FAILURE, unlike tauri-staging.yml. Without the App Store
            # Connect key the build would publish a DMG that is unsigned and
            # embeds no Finder extension — complete-looking and not complete.
            # Staging tolerates that because it is also used to test everything
            # unrelated to Finder, so losing the whole build to a lapsed secret
            # costs more than it saves, and its testers are people who can be
            # told. Beta ships to the public: they cannot be told, they would
            # hit an unsigned build at Gatekeeper and a missing "Share with
            # Hippius", and they would report both as product bugs. This is the
            # "swap the annotation for exit 1 if the trade ever changes" case
            # that staging's comment anticipates.
            echo "::error title=Refusing to publish a beta without notarization::App Store Connect API key not set. A beta DMG would be unsigned and would embed no Finder extension. Set APPLE_API_KEY_CONTENT / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID, or publish this build through the staging lane instead."
            exit 1
          fi

      - name: Build & publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          # Compile-time channel (release_channel.rs). Beta binaries report
          # themselves as beta, which is what points their update checks at
          # the beta manifest and what the in-app channel switch reads back.
          HIPPIUS_RELEASE_CHANNEL: beta
        with:
          tagName: v__VERSION__
          # The suffix rides on the release NAME because that list is where a
          # tester picks a build from; a caveat buried in the body is read after
          # the download, if at all.
          #
          # BEST-EFFORT, not guaranteed: publish-tauri-linux and
          # publish-tauri-windows have no `needs:` on this job and publish to
          # this same tag with `overwrite: true` and a hardcoded
          # `[BETA] Hippius` name, so whichever job creates the release first
          # wins the name.
          releaseName: "[BETA] ${{ steps.release_notes.outputs.title }}"
          releaseBody: |
            **Beta Build - macOS Only**

            > This is a prerelease. It follows the development work, so it has
            > the newest features first and those features are not fully
            > stabilized. Switch back from Settings at any time.

            ${{ steps.release_notes.outputs.body }}
          # Draft until publish-manifest has corrected latest.json, mirroring
          # tauri-build.yml. macOS is built --bundles app, so between here and
          # the finalize step the release carries no DMG at all; published,
          # that is indistinguishable from a good build to anyone browsing the
          # release list.
          #
          # ALL THREE JOBS must set this. They have no `needs:` on each other and
          # each upserts the same tag with `overwrite: true`, so the release's
          # properties are whatever the job that got there FIRST asked for. With
          # this true here and false in the other two, the v0.5.0-beta.3 run
          # published a release carrying macOS and Linux assets and no Windows
          # installer, because the Linux job finished first. Pinned by
          # `every_beta_job_publishes_a_draft`.
          releaseDraft: true
          prerelease: true
          makeLatest: false
          overwrite: true
          # Always app-only: the finalize step (re)builds the DMG + updater
          # tarball AFTER embedding the Finder extension, because embedding
          # re-signs the app and would invalidate a Tauri-built DMG and its
          # notarization. Staging has a no-creds fallback here; this lane does
          # not need one, since the apple step above exits 1 without them.
          args: '--target universal-apple-darwin --bundles app'

      # Embed the universal Finder extension into the app (Tauri built app-only),
      # inside-out re-sign, notarize + staple, then build the DMG + regenerate the
      # updater tarball from the embedded app, and attach them to the preview
      # release. Runs only when notarization creds are present (else the preview
      # stays app-only, as before). See
      # docs/plans/2026-07-01-finder-release-packaging.md.
      - name: Finalize macOS release (embed Finder extension)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
          APPLE_API_KEY: ${{ steps.apple.outputs.api_key }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.api_issuer }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Re-import the Developer ID cert into a keychain THIS step owns.
          # tauri-action imported the cert into its own temporary keychain
          # during "Build & publish" and tore it down when that step ended, so
          # codesign here would otherwise fail with "no identity found" (run
          # 28510203939). The inside-out re-sign resolves the identity from the
          # search list (embed-finder-extension.sh / finalize-macos-release.sh
          # call `codesign --sign "$APPLE_SIGNING_IDENTITY"` with no explicit
          # keychain), so create an unlocked keychain, import the cert, allow
          # codesign to use its key non-interactively, and prepend it to the
          # user search list. RUNNER_TEMP is ephemeral, so no teardown needed.
          KEYCHAIN_PATH="$RUNNER_TEMP/finalize-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/finalize-cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # -S grants codesign (and Apple tools) access to the private key with
          # no GUI prompt — required on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Put our keychain first on the search list, keeping the existing ones
          # (login.keychain-db etc.) so codesign resolves the Developer ID.
          # Word-splitting the inner command is intentional — each existing
          # keychain path must be a separate `-s` argument; quoting would pass
          # them as one and drop the rest of the search list.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippius.app"
          OUT="$RUNNER_TEMP/hippius-macos-dist"
          macos/finalize-macos-release.sh "$APP" "$OUT"
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          # The beta release already exists (tauri-action created it above).
          gh release upload "$TAG" \
            "$OUT"/*.dmg \
            "$OUT"/Hippius.app.tar.gz \
            "$OUT"/Hippius.app.tar.gz.sig \
            --clobber

          # tauri-action's own `--bundles app` output went up under a DIFFERENT
          # filename, so the --clobber above never replaced it. It is this same
          # app BEFORE the extension was embedded and before notarization: no
          # HippiusFinder.appex, no staple. Once the manifest is corrected
          # nothing references it — but it sits on the release page beside
          # Hippius_universal.dmg reading as its sibling, and anyone who takes it
          # installs a build with no "Share with Hippius" at all.
          for stale in Hippius_universal.app.tar.gz Hippius_universal.app.tar.gz.sig; do
            if gh release delete-asset "$TAG" "$stale" --yes 2>/dev/null; then
              echo "Removed pre-finalize artifact $stale"
            fi
          done

  # Linux preview: the .deb (with the file-manager "Share with Hippius" action
  # files wired in via tauri.conf.json's bundle.linux.deb). All three platform
  # jobs upsert the same v<version> release.
  publish-tauri-linux:
    runs-on: ubuntu-22.04
    # Creates the beta release and uploads artifacts to it. `pull-requests:
    # read` is for the release-notes step, which queries the PR API — without it
    # the title resolves empty and, on a push with no `#N` in the subject, `jq`
    # exits non-zero and fails the step under `set -euo pipefail`.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Nothing here pushes over git — the release uploads go through `gh`
          # with an explicit GH_TOKEN — so leaving the credential in .git/config
          # only widens what a compromised build step could reach.
          persist-credentials: false

      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()))
          PY
          chmod 600 ~/.ssh/private_git_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create src-tauri/.env
        shell: bash
        env:
          TAURI_ENV_FILE: ${{ secrets.TAURI_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAURI_ENV_FILE" | bash scripts/write-tauri-env.sh
          # Console origin is the same on every lane (see release_channel.rs).


      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Build & publish (deb)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          # Compile-time channel (release_channel.rs). Beta binaries report
          # themselves as beta, which is what points their update checks at
          # the beta manifest and what the in-app channel switch reads back.
          HIPPIUS_RELEASE_CHANNEL: beta
        with:
          tagName: v__VERSION__
          releaseName: '[BETA] Hippius'
          releaseBody: |
            **Beta Build**
          # Must match the macOS job — see the note there. Whichever job reaches
          # the release first decides, so a `false` here republishes a draft.
          releaseDraft: true
          prerelease: true
          makeLatest: false
          overwrite: true
          args: '--bundles deb'

  # Windows preview: the app installer (NSIS) + a separate, self-signed shell
  # extension bundle testers register manually (register-preview.ps1). The
  # sparse MSIX can't be auto-registered by the installer without a procured
  # cert, so for internal preview the extension ships as a side bundle.
  publish-tauri-windows:
    runs-on: windows-latest
    # Creates the beta release and uploads artifacts to it. `pull-requests:
    # read` is for the release-notes step, which queries the PR API — without it
    # the title resolves empty and, on a push with no `#N` in the subject, `jq`
    # exits non-zero and fails the step under `set -euo pipefail`.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          # Nothing here pushes over git — the release uploads go through `gh`
          # with an explicit GH_TOKEN — so leaving the credential in .git/config
          # only widens what a compromised build step could reach.
          persist-credentials: false

      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()))
          PY
          chmod 600 ~/.ssh/private_git_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Force Cargo to use the git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > ~/.cargo/config.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create src-tauri/.env
        shell: bash
        env:
          TAURI_ENV_FILE: ${{ secrets.TAURI_ENV_FILE }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAURI_ENV_FILE" | bash scripts/write-tauri-env.sh
          # Console origin is the same on every lane (see release_channel.rs).


      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Build the shell extension (self-signed sparse MSIX)
        shell: pwsh
        run: ./package-selfsigned.ps1
        working-directory: windows/HippiusShell

      - name: Build & publish (NSIS installer)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          # Compile-time channel (release_channel.rs). Beta binaries report
          # themselves as beta, which is what points their update checks at
          # the beta manifest and what the in-app channel switch reads back.
          HIPPIUS_RELEASE_CHANNEL: beta
        with:
          tagName: v__VERSION__
          releaseName: '[BETA] Hippius'
          releaseBody: |
            **Beta Build**
          # Must match the macOS job — see the note there. Whichever job reaches
          # the release first decides, so a `false` here republishes a draft.
          releaseDraft: true
          prerelease: true
          makeLatest: false
          overwrite: true
          args: '--bundles nsis'

      - name: Bundle + upload the shell extension for testers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          $out = "windows/HippiusShell/out"
          Copy-Item windows/HippiusShell/register-preview.ps1 "$out/"
          @"
          Hippius Explorer 'Share with Hippius' — PREVIEW (self-signed).

          1. Install Hippius from the *-setup.exe in this release.
          2. Extract this zip; open an ADMIN PowerShell in the extracted folder.
          3. Run:  ./register-preview.ps1
          4. Right-click a file/folder in Explorer -> Share with Hippius.

          Remove: Get-AppxPackage *Hippius.ShellExtension* | Remove-AppxPackage
          "@ | Set-Content "$out/README-INSTALL.txt"
          Compress-Archive -Path "$out/HippiusShell.dll","$out/HippiusShellSparse.msix","$out/HippiusPreviewCert.cer","$out/register-preview.ps1","$out/README-INSTALL.txt" -DestinationPath "HippiusShellExtension-preview.zip" -Force
          gh release upload $tag HippiusShellExtension-preview.zip --clobber

  # ---------------------------------------------------------------------------
  # Final job: correct latest.json for macOS, then republish it to the fixed
  # `beta` tag so the updater has a stable URL to check.
  #
  # Runs ONCE, after all three platform jobs have uploaded to the versioned
  # release. Two things those jobs structurally cannot do:
  #
  #   1. Correct latest.json — macOS is built app-only (--bundles app) so the
  #      Finder extension can be embedded afterwards. tauri-action therefore
  #      never builds a macOS updater tarball and its manifest has NO darwin
  #      entry; the real universal tarball and its minisign signature are
  #      produced later by the finalize step. This merges the two darwin-*
  #      entries in, leaving the windows entry tauri-action wrote untouched.
  #      Same correction tauri-build.yml makes for production.
  #
  #   2. Serve a stable URL — every beta release carries its own version tag
  #      (v0.5.0-beta.3) and GitHub's `releases/latest` resolves only to a
  #      NON-prerelease, so neither addresses "the newest beta". The fixed
  #      `beta` release below holds one asset, latest.json, overwritten every
  #      build; that is the URL ReleaseChannel::Beta::manifest_url() points at.
  #      Its own `url` fields still address the real versioned assets.
  assemble-release:
    needs: [publish-tauri-macos, publish-tauri-linux, publish-tauri-windows]
    permissions:
      contents: write # upload latest.json + SHA256SUMS, edit the release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read version -> tag)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Correct latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"

          # The version already carries its -beta.N suffix, so the tag needs none.
          TAG="v$(jq -r .version "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json")"
          echo "Finalizing beta release $TAG"

          # tauri-action's manifest: correct windows entry, no darwin entry.
          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --dir . || true

          # The macOS updater signature the finalize step attached. Unlike
          # staging this is not optional: the apple step exits 1 without
          # notarization creds, so a missing signature here means the finalize
          # step failed silently and the manifest must NOT be published — a beta
          # user would be offered an update that cannot verify.
          if ! gh release download "$TAG" --repo "$REPO" \
                 --pattern 'Hippius.app.tar.gz.sig' --dir . \
               || [[ ! -s Hippius.app.tar.gz.sig ]]; then
            echo "::error title=No macOS updater signature::$TAG has no Hippius.app.tar.gz.sig, so latest.json would offer macOS an update it cannot verify. Refusing to republish the beta manifest."
            exit 1
          fi
          MAC_SIG="$(cat Hippius.app.tar.gz.sig)"

          # The universal tarball serves BOTH Apple slices, so both darwin keys
          # point at the same asset (mirrors tauri-action's universal handling).
          #
          # The `-app` keys are NOT optional extras: tauri-plugin-updater
          # resolves `[{os}-{arch}-{installer}, {os}-{arch}]` IN THAT ORDER
          # (updater.rs, `get_urls`), and `installer_for_bundle_type` maps a
          # macOS .app — which is also what a DMG install reports — to `app`.
          # So `darwin-<arch>-app` is the key macOS actually reads, and
          # tauri-action points it at ITS artifact: the pre-finalize
          # `--bundles app` build, which has no Finder extension embedded and
          # was never notarized or stapled. Patching only the bare keys left the
          # fix unreachable and every macOS auto-update silently replaced the
          # installed app with an extension-less, unstapled one.
          URL="https://github.com/${REPO}/releases/download/${TAG}/Hippius.app.tar.gz"
          if [[ -f latest.json ]]; then
            jq --arg url "$URL" --arg sig "$MAC_SIG" '
              .platforms["darwin-aarch64"] = {signature: $sig, url: $url}
              | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}
              | .platforms["darwin-aarch64-app"] = {signature: $sig, url: $url}
              | .platforms["darwin-x86_64-app"] = {signature: $sig, url: $url}
            ' latest.json > latest.json.new
          else
            jq -n --arg v "${TAG#v}" --arg url "$URL" --arg sig "$MAC_SIG" '
              {version: $v, notes: "", pub_date: (now | todate),
               platforms: {
                 "darwin-aarch64": {signature: $sig, url: $url},
                 "darwin-x86_64":  {signature: $sig, url: $url},
                 "darwin-aarch64-app": {signature: $sig, url: $url},
                 "darwin-x86_64-app":  {signature: $sig, url: $url}}}
            ' > latest.json.new
          fi
          mv latest.json.new latest.json

          # Publish the build's STATE_EPOCH beside the version. Tauri ignores
          # unknown manifest keys and hands the whole document back on
          # Update::raw_json, which is how the OTHER channel reads it: a build
          # refuses to switch to a lane whose epoch is behind its own, because
          # that build cannot read the state this one has already written.
          # Parsed from the Rust constant so the manifest cannot claim an epoch
          # the code does not have.
          EPOCH="$(grep -oE 'const STATE_EPOCH: u32 = [0-9]+' "$GITHUB_WORKSPACE/src-tauri/src/updates.rs" | grep -oE '[0-9]+$')"
          if [[ -z "$EPOCH" ]]; then
            echo "::error title=Could not read STATE_EPOCH::src-tauri/src/updates.rs no longer declares 'const STATE_EPOCH: u32 = <n>'. The manifest would omit it, which every build reads as 'unknown' and permits — silently disabling the downgrade guard."
            exit 1
          fi
          jq --argjson epoch "$EPOCH" '.stateEpoch = $epoch' latest.json > latest.json.new
          mv latest.json.new latest.json
          echo "Manifest declares stateEpoch=$EPOCH"

          gh release upload "$TAG" --repo "$REPO" latest.json --clobber

      # Checksums for every asset (from the API's own digests, nothing is
      # downloaded) plus a Downloads table naming the installer per platform.
      # Runs BEFORE verification so the asset set the next job checks is final.
      - name: Attach SHA256SUMS and name the downloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          scripts/publish-release-downloads.sh "v$(jq -r .version src-tauri/tauri.conf.json)"

  # ---------------------------------------------------------------------------
  # Open the artifacts and refuse to publish a build that is not what the
  # release claims. Same gate as tauri-build.yml, and it matters at least as
  # much here: beta is where a packaging regression should be caught, and the
  # rolling beta-channel pointer below is what the beta fleet updates from.
  #
  # Runs against the DRAFT's assets — the bytes testers will actually get —
  # rather than the runner's build output, so a bad upload is caught too.
  verify-release:
    needs: assemble-release
    permissions:
      # Read-only in effect: this job only downloads. It needs `write` because
      # GitHub hides DRAFT releases from tokens below push access, so
      # `contents: read` cannot see the release at all.
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout (verification scripts + the committed updater pubkey)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install minisign
        run: brew install minisign

      - name: Verify the macOS artifacts and the manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="v$VERSION"
          DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$DIR"

          gh release download "$TAG" --repo "$REPO" --dir "$DIR" \
            --pattern 'Hippius.app.tar.gz' \
            --pattern 'Hippius.app.tar.gz.sig' \
            --pattern '*.dmg'

          macos/verify-macos-artifacts.sh "$DIR" "$VERSION"
          scripts/verify-release-manifest.sh "$TAG" "$VERSION"

  # ---------------------------------------------------------------------------
  # Move the rolling pointer and publish — both only after verification, since
  # republishing beta-channel is what actually offers the build to the fleet.
  publish-release:
    needs: verify-release
    permissions:
      contents: write # upload latest.json to `beta-channel`, draft -> published
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read version -> tag)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Republish the rolling manifest and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          TAG="v$(jq -r .version "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json")"

          # The verified manifest, taken from the release rather than rebuilt,
          # so the rolling pointer serves exactly the bytes the previous job
          # checked.
          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --dir .

          # The rolling pointer. Created on first run, reused forever after; it
          # is a prerelease so it can never become `releases/latest` and be
          # served to production users. It deliberately holds NO build assets —
          # only the manifest, whose url fields address the versioned release.
          # Tag name deliberately NOT `beta`: that is the branch name, and a tag
          # sharing it makes every `git push origin beta` fail with "src refspec
          # beta matches more than one" and every `git checkout beta` ambiguous —
          # breaking the promotion flow this lane exists for.
          if ! gh release view beta-channel --repo "$REPO" >/dev/null 2>&1; then
            gh release create beta-channel --repo "$REPO" \
              --title "Beta channel manifest" \
              --notes "Update manifest for the beta channel. Not a build — see the versioned beta releases for downloads. This tag exists so the updater has a stable URL, since GitHub's /releases/latest never resolves to a prerelease." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          # Publish the versioned release BEFORE moving the pointer at it. A
          # draft's asset URLs 404 for everyone, and the manifest's `url` fields
          # address the versioned release — so republishing beta-channel first
          # offers the fleet an update that cannot be downloaded until the flip
          # below lands. The other order is only ever briefly wrong; this one is
          # never wrong, since a pointer left on the previous beta is exactly
          # the state every client is already in.
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease

          gh release upload beta-channel --repo "$REPO" latest.json --clobber
          echo "Beta $TAG published and the rolling manifest republished."
