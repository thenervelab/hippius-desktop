name: publish-preview

on:
  workflow_dispatch:
  push:
    branches: [redesign-preview]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  publish-tauri-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode private key from base64
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          b64 = os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()
          sys.stdout.buffer.write(base64.b64decode(b64))
          PY
          chmod 600 ~/.ssh/private_git_key

          # Trust GitHub host key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # SSH config
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          # Start ssh-agent
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          # Add key (no passphrase)
          ssh-add ~/.ssh/private_git_key
          ssh-add -l

      - name: Force Cargo to use git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Verify SSH access to hcfs
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote ssh://git@github.com/thenervelab/hcfs.git HEAD

      - name: Verify pinned hcfs commit is fetchable
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          REV=$(grep -m1 'thenervelab/hcfs.git' src-tauri/Cargo.toml | sed 's/.*rev *= *"\([^"]*\)".*/\1/')
          echo "Pinned hcfs rev: $REV"
          if git ls-remote ssh://git@github.com/thenervelab/hcfs.git | grep -q "$REV"; then
            echo "Commit $REV found at remote ref"
          else
            echo "Commit not at a ref tip, verifying via shallow clone..."
            git clone --bare --filter=blob:none ssh://git@github.com/thenervelab/hcfs.git /tmp/hcfs-verify
            git -C /tmp/hcfs-verify cat-file -t "$REV"
          fi

      - name: Get release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          PR_NUMBER="$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | tr -d '# ' || true)"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            PR_NUMBER="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
              | jq -r '.[0].number // empty')"
          fi

          if [[ -n "${PR_NUMBER:-}" ]]; then
            PR_INFO="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")"

            TITLE="$(jq -r '.title // empty' <<<"$PR_INFO")"
            BODY="$(jq -r '.body // empty'  <<<"$PR_INFO")"
          else
            TITLE="$(git log -1 --pretty=%s)"
            BODY="$(git log -1 --pretty=%b)"
          fi

          TITLE="${TITLE//$'\r'/}"
          BODY="${BODY//$'\r'/}"
          if [[ -z "${BODY:-}" ]]; then
            BODY="See the assets to download this version and install."
          fi

          BODY="$(printf '%s' "$BODY" | head -c 30000)"

          {
            echo "title<<__TITLE__"
            echo "$TITLE"
            echo "__TITLE__"
            echo "body<<__BODY__"
            echo "$BODY"
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # rust-toolchain.toml pins the build toolchain, which rustup
      # auto-installs at first cargo use with only the host (aarch64)
      # target. A bare `rustup target add` is NOT enough: it applies to the
      # rustup *default* (stable, set by the action above), not the pinned
      # toolchain — run 27331470103 proved it ("rust-std up to date" in 0.1s
      # while the universal build still missed x86_64). Parse the pinned
      # channel and install/target it explicitly.
      - name: Add Apple targets to the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The pin lives in src-tauri/ (the Rust workspace); fall back to the
          # repo root in case it moves again.
          channel=""
          for f in src-tauri/rust-toolchain.toml rust-toolchain.toml; do
            if [[ -f "$f" ]]; then
              channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$f")
              echo "Pinned toolchain channel: ${channel} (from $f)"
              break
            fi
          done
          if [[ -z "$channel" ]]; then
            echo "No rust-toolchain.toml found — stable already has both targets"
            exit 0
          fi
          rustup toolchain install "${channel}" --no-self-update
          rustup target add --toolchain "${channel}" aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: PNPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create src-tauri/.env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          cat > src-tauri/.env << 'EOF'
          ${{ secrets.TAURI_ENV_FILE }}
          EOF
          chmod 600 src-tauri/.env

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      # macOS packaging tools for the Finder extension: xcodegen builds the
      # universal .appex; create-dmg builds the installer (the finalize step
      # owns the DMG since the extension is embedded after Tauri builds the app).
      - name: Install macOS packaging tools
        run: brew install xcodegen create-dmg

      # Apple code signing. The App Group the Finder extension needs is granted
      # only to code signed by Team V28B5X732P, so a real Developer ID cert is
      # required (the preview build was previously ad-hoc/unsigned). The CERT
      # goes to GITHUB_ENV so tauri-action signs the app; notarization is
      # withheld from tauri-action (the extension is embedded + the app re-signed
      # afterwards, which invalidates any earlier notarization) and surfaced as
      # step OUTPUTS consumed by the finalize step. The preview UPDATER key
      # (TAURI_SIGNING_PRIVATE_KEY / preview pubkey) is unchanged — only the
      # Apple code-signing cert is added here.
      - name: Set up Apple signing
        id: apple
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Code signing enabled."
          else
            echo "APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY not set — building unsigned; the Finder extension will be skipped (App Groups need a real Team ID)."
          fi
          if [[ -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER_ID" ]]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
            {
              echo "api_key_path=$KEY_PATH"
              echo "api_key=$APPLE_API_KEY_ID"
              echo "api_issuer=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_OUTPUT"
            echo "Notarization enabled (finalize step)."
          else
            echo "App Store Connect API key not set — skipping notarization + Finder embed."
          fi

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        with:
          tagName: v__VERSION__-preview
          releaseName: '[PREVIEW] ${{ steps.release_notes.outputs.title }}'
          releaseBody: |
            **🎨 Redesign Preview Build - macOS Only**

            ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          makeLatest: false
          overwrite: true
          # App-only: the DMG + updater tarball are (re)built by the finalize step
          # after the Finder extension is embedded (embedding re-signs the app and
          # would invalidate a Tauri-built DMG/notarization).
          args: '--target universal-apple-darwin --bundles app'

      # Embed the universal Finder extension into the app (Tauri built app-only),
      # inside-out re-sign, notarize + staple, then build the DMG + regenerate the
      # updater tarball from the embedded app, and attach them to the preview
      # release. Runs only when notarization creds are present (else the preview
      # stays app-only, as before). See
      # docs/plans/2026-07-01-finder-release-packaging.md.
      - name: Finalize macOS preview (embed Finder extension)
        if: steps.apple.outputs.api_key != ''
        shell: bash
        env:
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
          APPLE_API_KEY: ${{ steps.apple.outputs.api_key }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.api_issuer }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # APPLE_SIGNING_IDENTITY is already in the environment from the signing step.
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippius.app"
          OUT="$RUNNER_TEMP/hippius-macos-dist"
          macos/finalize-macos-release.sh "$APP" "$OUT"
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)-preview"
          # The preview release already exists (tauri-action created it above).
          gh release upload "$TAG" \
            "$OUT"/*.dmg \
            "$OUT"/Hippius.app.tar.gz \
            "$OUT"/Hippius.app.tar.gz.sig \
            --clobber
