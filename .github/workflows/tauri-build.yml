name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin" # One universal mac build
          - platform: ubuntu-22.04
            args: "--bundles deb"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history to get commit messages

      # Get PR or commit details for the release notes
      - name: Get release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          # Commit data
          SHA="$(git rev-parse HEAD)"

          # Try to read PR number from commit subject like "... (#123)"
          PR_NUMBER="$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | tr -d '# ' || true)"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            # Better: ask GitHub which PR(s) are linked to this commit
            PR_NUMBER="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
              | jq -r '.[0].number // empty')"
          fi

          if [[ -n "${PR_NUMBER:-}" ]]; then
            echo "Found PR #$PR_NUMBER"
            PR_INFO="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")"

            TITLE="$(jq -r '.title // empty' <<<"$PR_INFO")"
            BODY="$(jq -r '.body // empty'  <<<"$PR_INFO")"
          else
            echo "No PR found. Using last commit."
            TITLE="$(git log -1 --pretty=%s)"
            BODY="$(git log -1 --pretty=%b)"
          fi

          # Normalize endings and guard empties
          TITLE="${TITLE//$'\r'/}"
          BODY="${BODY//$'\r'/}"
          if [[ -z "${BODY:-}" ]]; then
            BODY="See the assets to download this version and install."
          fi

          # Optional: trim very large bodies (example: 30000 chars)
          BODY="$(printf '%s' "$BODY" | head -c 30000)"

          # Write to $GITHUB_OUTPUT using multiline-safe heredoc
          {
            echo "title<<__TITLE__"
            echo "$TITLE"
            echo "__TITLE__"
            echo "body<<__BODY__"
            echo "$BODY"
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Needed so universal contains BOTH slices
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # src-tauri/rust-toolchain.toml pins the build to a specific channel
      # (1.95.0), which rustup auto-installs at first `cargo` use with ONLY the
      # host (aarch64) target. The step above only adds the Apple targets to
      # *stable*, so the universal build still can't find x86_64-apple-darwin.
      # Parse the pinned channel and add both Apple slices to *that* toolchain.
      - name: Add Apple targets to the pinned toolchain
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # The pin lives in src-tauri/ (the Rust workspace); fall back to the
          # repo root in case it moves again.
          channel=""
          for f in src-tauri/rust-toolchain.toml rust-toolchain.toml; do
            if [[ -f "$f" ]]; then
              channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$f")
              echo "Pinned toolchain channel: ${channel} (from $f)"
              break
            fi
          done
          if [[ -z "$channel" ]]; then
            echo "No rust-toolchain.toml found — stable already has both targets"
            exit 0
          fi
          rustup toolchain install "${channel}" --no-self-update
          rustup target add --toolchain "${channel}" aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: PNPM cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create Tauri env
        run: |
          echo "INDEXER_API_KEY=${{ secrets.INDEXER_API_KEY }}" > src-tauri/.env

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      # Apple code signing + notarization (macOS only). Exported via GITHUB_ENV
      # instead of the tauri-action env block because an unset secret renders as
      # an empty string there, and tauri treats empty APPLE_SIGNING_IDENTITY /
      # APPLE_API_KEY as "present" — failing the build instead of skipping.
      # With secrets set: tauri-action imports the base64 .p12 into a throwaway
      # keychain and signs; the bundler then notarizes the app + DMG with the
      # App Store Connect API key and staples the ticket.
      - name: Set up Apple signing & notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Code signing enabled."
          else
            echo "APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secrets not set — building unsigned."
          fi
          if [[ -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER_ID" ]]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
            {
              echo "APPLE_API_KEY_PATH=$KEY_PATH"
              echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization enabled."
          else
            echo "App Store Connect API key secrets not set — skipping notarization."
          fi

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "${{ steps.release_notes.outputs.title }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          overwrite: true
          args: ${{ matrix.args }}
