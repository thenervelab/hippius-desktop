name: publish

on:
  # Auto-publish on every push to main (the pre-0.2.1 behavior, restored by
  # request). The matrix job builds the release as a DRAFT; the final
  # publish-release job flips it to published only AFTER the macOS Finder
  # extension is embedded and a correct latest.json is written — so a failed
  # build or a rejected notarization never becomes the fleet's "latest", and the
  # auto-updater never sees a half-finished release (the residual H-12 guard).
  workflow_dispatch:
  push:
    branches: [main]
    # Skip the release when a push changes nothing that can reach the artifact.
    # This is a DENYLIST on purpose: an unrecognized path still builds, so the
    # failure mode of forgetting an entry is one wasted build, not a release
    # that silently never ships. Nothing listed here is an input to the build —
    # no markdown is `include_str!`d, imported by the frontend, bundled in
    # `bundle.resources` (icons + `.env` only), or read by this workflow; the
    # release body comes from PR/commit metadata, not CHANGELOG.md.
    #
    # Deliberately NOT ignored: `.github/**` (a workflow edit must be testable
    # on the branch it ships from), `public/**` and `app/**` (the Next build),
    # `.gitmodules`, and every lockfile/config at the root — including the three
    # files a version bump touches (tauri.conf.json, Cargo.toml, package.json),
    # since a bump with no other change still has to cut a release.
    #
    # `workflow_dispatch` ignores path filters, so a manual run is always the
    # escape hatch when a docs-only commit does need a release cut.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - ".vscode/**"
      - ".gitignore"
      - ".git-blame-ignore-revs"

# Least privilege at the workflow level. The two jobs that create and publish
# the GitHub release request `contents: write` per-job below — a workflow-level
# write grant spanning multiple jobs trips zizmor's excessive-permissions audit.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

# hcfs-client/hcfs-shared are pulled from the PRIVATE thenervelab/hcfs repo over
# ssh; force Cargo to fetch via the git CLI so it honors the deploy key the
# build job installs into ~/.ssh below.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Human approval gate for the whole production lane.
  #
  # Branch protection alone cannot cover this workflow: it also triggers on
  # `workflow_dispatch`, so anyone with write access could cut a production
  # release straight from the Actions tab without a commit ever reaching `main`.
  # The `production` GitHub Environment carries a required-reviewer rule, so
  # EVERY run — pushed or dispatched — pauses here until a named reviewer
  # approves it, and the environment's branch policy restricts deployments to
  # protected branches.
  #
  # It does no work; it exists purely so the environment's protection rule is
  # evaluated ONCE before anything builds, signs or publishes. Putting
  # `environment:` on the matrix job instead would raise one approval prompt per
  # platform leg.
  approve-release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "Production release approved for $REF_NAME."

  publish-tauri:
    needs: approve-release
    permissions:
      contents: write # create the draft release + upload platform assets
      pull-requests: read # release-notes step reads the linked PR via the API
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # App-only: the DMG + updater tarball are (re)built by the finalize
            # step AFTER the Finder extension is embedded, since embedding
            # re-signs the app and would invalidate a Tauri-built DMG/notarization.
            args: "--target universal-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            args: "--bundles deb"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Fetch all history to get commit messages
          # Don't leave the GITHUB_TOKEN in .git/config — it would otherwise
          # persist into any artifact built from this checkout (zizmor
          # artipacked). The release-notes step uses the token via the API, and
          # the private hcfs dep is fetched over a separate SSH deploy key, so
          # no git operation here needs the persisted credential.
          persist-credentials: false

      # CI has no developer SSH key, so install the hcfs deploy key and trust
      # github.com. Without this the build dies at "failed to authenticate when
      # downloading repository" while fetching the private hcfs-client crate.
      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Decode private key from base64
          echo "$PRIVATE_GIT_DEPLOY_KEY_B64" | python3 -c "
          import sys, base64
          data = sys.stdin.read().strip()
          sys.stdout.buffer.write(base64.b64decode(data))
          " > ~/.ssh/private_git_key
          chmod 600 ~/.ssh/private_git_key

          # Trust GitHub host key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          # SSH config — git uses the key automatically (no ssh-agent needed)
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Force Cargo to use git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      # The pinned rev lives in history but not at a branch tip, so a plain
      # ls-remote won't list it; fall back to a blobless bare clone + cat-file
      # to prove it is fetchable before the much longer cargo build starts.
      - name: Verify pinned hcfs commit is fetchable
        shell: bash
        run: |
          set -euo pipefail
          REV=$(grep -m1 'thenervelab/hcfs.git' src-tauri/Cargo.toml | sed 's/.*rev *= *"\([^"]*\)".*/\1/')
          echo "Pinned hcfs rev: $REV"
          if git ls-remote ssh://git@github.com/thenervelab/hcfs.git | grep -q "$REV"; then
            echo "Commit $REV found at a remote ref"
          else
            echo "Commit not at a ref tip; verifying via shallow clone..."
            git clone --bare --filter=blob:none ssh://git@github.com/thenervelab/hcfs.git /tmp/hcfs-verify
            git -C /tmp/hcfs-verify cat-file -t "$REV"
          fi

      # Get PR or commit details for the release notes
      - name: Get release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          # Commit data
          SHA="$(git rev-parse HEAD)"

          # Try to read PR number from commit subject like "... (#123)"
          PR_NUMBER="$(git log -1 --pretty=format:'%s' | grep -oE '#[0-9]+' | tr -d '# ' || true)"

          if [[ -z "${PR_NUMBER:-}" ]]; then
            # Better: ask GitHub which PR(s) are linked to this commit
            PR_NUMBER="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/pulls" \
              | jq -r '.[0].number // empty')"
          fi

          if [[ -n "${PR_NUMBER:-}" ]]; then
            echo "Found PR #$PR_NUMBER"
            PR_INFO="$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")"

            TITLE="$(jq -r '.title // empty' <<<"$PR_INFO")"
            BODY="$(jq -r '.body // empty'  <<<"$PR_INFO")"
          else
            echo "No PR found. Using last commit."
            TITLE="$(git log -1 --pretty=%s)"
            BODY="$(git log -1 --pretty=%b)"
          fi

          # Normalize endings and guard empties
          TITLE="${TITLE//$'\r'/}"
          BODY="${BODY//$'\r'/}"
          if [[ -z "${BODY:-}" ]]; then
            BODY="See the assets to download this version and install."
          fi

          # Optional: trim very large bodies (example: 30000 chars)
          BODY="$(printf '%s' "$BODY" | head -c 30000)"

          # Write to $GITHUB_OUTPUT using multiline-safe heredoc
          {
            echo "title<<__TITLE__"
            echo "$TITLE"
            echo "__TITLE__"
            echo "body<<__BODY__"
            echo "$BODY"
            echo "__BODY__"
          } >> "$GITHUB_OUTPUT"
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Needed so universal contains BOTH slices
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # src-tauri/rust-toolchain.toml pins the build to a specific channel
      # (1.95.0), which rustup auto-installs at first `cargo` use with ONLY the
      # host (aarch64) target. The step above only adds the Apple targets to
      # *stable*, so the universal build still can't find x86_64-apple-darwin.
      # Parse the pinned channel and add both Apple slices to *that* toolchain.
      - name: Add Apple targets to the pinned toolchain
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # The pin lives in src-tauri/ (the Rust workspace); fall back to the
          # repo root in case it moves again.
          channel=""
          for f in src-tauri/rust-toolchain.toml rust-toolchain.toml; do
            if [[ -f "$f" ]]; then
              channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' "$f")
              echo "Pinned toolchain channel: ${channel} (from $f)"
              break
            fi
          done
          if [[ -z "$channel" ]]; then
            echo "No rust-toolchain.toml found — stable already has both targets"
            exit 0
          fi
          rustup toolchain install "${channel}" --no-self-update
          rustup target add --toolchain "${channel}" aarch64-apple-darwin x86_64-apple-darwin
          rustup show

      # A SIGNED release must not restore build caches that a less-privileged PR
      # workflow can populate — a poisoned `target/` or pnpm store could be baked
      # into the signed bundle (zizmor cache-poisoning). Releases are infrequent,
      # so a cold build is the right trade; the Rust + PNPM caches the PR CI
      # (ci.yml) relies on are deliberately ABSENT here.
      - name: Setup Node
        # setup-node only caches when a `cache:` input is given (it isn't here),
        # so the cache-poisoning finding is a false positive for this uncached use.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "lts/*"

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Same secret the staging and dev channels use. This step used to write
      # `INDEXER_API_KEY=${{ secrets.INDEXER_API_KEY }}`, and no secret by that
      # name exists at the repository or organization level — an undefined
      # secret expands to the empty string, so the release would have bundled an
      # empty key. The app treats that as "configured" and sends it, the indexer
      # answers 401, and every indexer-backed screen renders a zero instead of an
      # error. The script fails the build rather than let that ship again.
      - name: Create src-tauri/.env
        shell: bash
        env:
          TAURI_ENV_FILE: ${{ secrets.TAURI_ENV_FILE }}
        run: printf '%s\n' "$TAURI_ENV_FILE" | bash scripts/write-tauri-env.sh

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      # macOS packaging tools for the Finder extension: xcodegen builds the
      # universal .appex from macos/HippiusFinder/project.yml; create-dmg builds
      # the styled installer (Tauri's own DMG step is disabled below because the
      # extension is embedded AFTER Tauri finishes — see the finalize step).
      - name: Install macOS packaging tools
        if: matrix.platform == 'macos-latest'
        run: brew install xcodegen create-dmg

      # Apple code signing (macOS only). The CERT goes to GITHUB_ENV so
      # tauri-action imports the .p12 and SIGNS the app. Notarization is
      # DELIBERATELY withheld from tauri-action: embedding the Finder extension
      # after the build re-signs the app and invalidates any earlier notarization,
      # so notarization is done in the finalize step below, on the fully embedded
      # bundle. The App Store Connect key is therefore surfaced as STEP OUTPUTS
      # (consumed only by the finalize step), not GITHUB_ENV. Exported via
      # GITHUB_ENV rather than the tauri-action env block because an unset secret
      # renders as an empty string there, which tauri treats as "present" and
      # fails on instead of skipping.
      - name: Set up Apple signing
        id: apple
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Code signing enabled."
          else
            echo "APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY secrets not set — building unsigned."
          fi
          if [[ -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER_ID" ]]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
            {
              echo "api_key_path=$KEY_PATH"
              echo "api_key=$APPLE_API_KEY_ID"
              echo "api_issuer=$APPLE_API_ISSUER_ID"
            } >> "$GITHUB_OUTPUT"
            echo "Notarization enabled (finalize step)."
          else
            echo "App Store Connect API key secrets not set — skipping notarization."
          fi

      - name: Build & publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "${{ steps.release_notes.outputs.title }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          # Build as a DRAFT. The final publish-release job flips it to published
          # once every platform's assets + a correct latest.json are attached, so
          # the auto-updater never serves a half-built release (residual H-12
          # guard even though we auto-publish on main again).
          releaseDraft: true
          prerelease: false
          overwrite: true
          args: ${{ matrix.args }}

      # macOS only, and only when notarization creds are present. Tauri built the
      # app app-only above (no DMG); here we embed the universal Finder extension,
      # inside-out re-sign, notarize + staple, then build the DMG + regenerate the
      # updater tarball FROM the embedded app, and attach them to the draft
      # release. See docs/plans/2026-07-01-finder-release-packaging.md for the
      # design and the remaining updater-manifest (latest.json) validation item.
      - name: Finalize macOS release (embed Finder extension)
        if: matrix.platform == 'macos-latest' && steps.apple.outputs.api_key != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ steps.apple.outputs.api_key_path }}
          APPLE_API_KEY: ${{ steps.apple.outputs.api_key }}
          APPLE_API_ISSUER: ${{ steps.apple.outputs.api_issuer }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Re-import the Developer ID cert into a keychain THIS step owns.
          # tauri-action imported the cert into its own temporary keychain
          # during "Build & publish" and tore it down when that step ended, so
          # codesign here would otherwise fail with "no identity found" (proven
          # on the preview workflow, run 28510203939, and fixed by this same
          # block). The inside-out re-sign resolves the identity from the search
          # list (embed-finder-extension.sh / finalize-macos-release.sh call
          # `codesign --sign "$APPLE_SIGNING_IDENTITY"` with no explicit
          # keychain), so create an unlocked keychain, import the cert, allow
          # codesign to use its key non-interactively, and prepend it to the
          # user search list. RUNNER_TEMP is ephemeral, so no teardown needed.
          KEYCHAIN_PATH="$RUNNER_TEMP/finalize-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/finalize-cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # -S grants codesign (and Apple tools) access to the private key with
          # no GUI prompt — required on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Put our keychain first on the search list, keeping the existing ones
          # (login.keychain-db etc.) so codesign resolves the Developer ID.
          # Word-splitting the inner command is intentional — each existing
          # keychain path must be a separate `-s` argument; quoting would pass
          # them as one and drop the rest of the search list.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

          # The universal app the app-only Tauri build produced:
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Hippius.app"
          OUT="$RUNNER_TEMP/hippius-macos-dist"
          macos/finalize-macos-release.sh "$APP" "$OUT"
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          # The draft release already exists (tauri-action created it above, same
          # tag). Attach the notarized DMG (fresh installs) plus the regenerated
          # updater tarball + signature. --clobber replaces any same-named asset.
          gh release upload "$TAG" \
            "$OUT"/*.dmg \
            "$OUT"/Hippius.app.tar.gz \
            "$OUT"/Hippius.app.tar.gz.sig \
            --clobber

  # ---------------------------------------------------------------------------
  # Final job: fix latest.json for macOS, then publish the draft release.
  #
  # Runs ONCE, after all three platform builds have uploaded their assets to the
  # draft release (needs: publish-tauri waits for every matrix leg to succeed).
  # Two things the matrix legs structurally cannot do:
  #
  #   1. Correct latest.json — macOS is built app-only (--bundles app) so the
  #      Finder extension can be embedded afterwards. That means tauri-action
  #      never builds a macOS updater tarball, and its generated latest.json has
  #      NO darwin entry. The correct universal tarball + its minisign signature
  #      are produced later, by the macOS finalize step. Here we merge the two
  #      darwin-* entries into tauri-action's manifest, leaving the windows entry
  #      it already wrote untouched. Without this, a 0.2.0 macOS user is never
  #      offered the update (the reported gap).
  #
  #   2. Publish last — flipping draft -> published as the final step means a
  #      failed build or a rejected notarization never becomes the fleet's
  #      "latest" (releases/latest/download/latest.json resolves to the newest
  #      PUBLISHED, non-draft, non-prerelease release only).
  publish-release:
    needs: publish-tauri
    permissions:
      contents: write # edit the release (draft -> published) + upload latest.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read version -> tag)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fix latest.json (macOS) and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"

          # tauri-action tagged the release v__VERSION__; read the version from
          # the checked-in config so this job needs no build artifacts.
          TAG="v$(jq -r .version "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json")"
          echo "Finalizing release $TAG"

          # tauri-action's manifest: correct windows entry, no darwin entry
          # (macOS was app-only). Absent only if no updater artifact was produced.
          gh release download "$TAG" --repo "$REPO" --pattern 'latest.json' --dir . || true

          # The macOS updater signature the finalize step attached — present
          # whenever notarization secrets are configured, absent otherwise.
          MAC_SIG=""
          if gh release download "$TAG" --repo "$REPO" \
               --pattern 'Hippius.app.tar.gz.sig' --dir . 2>/dev/null \
             && [[ -f Hippius.app.tar.gz.sig ]]; then
            MAC_SIG="$(cat Hippius.app.tar.gz.sig)"
          fi

          if [[ -n "$MAC_SIG" ]]; then
            # The universal tarball serves BOTH Apple slices, so both darwin keys
            # point at the same asset (mirrors tauri-action's own universal
            # handling). The URL is the public tagged path, valid once published.
            URL="https://github.com/${REPO}/releases/download/${TAG}/Hippius.app.tar.gz"
            if [[ -f latest.json ]]; then
              jq --arg url "$URL" --arg sig "$MAC_SIG" '
                .platforms["darwin-aarch64"] = {signature: $sig, url: $url}
                | .platforms["darwin-x86_64"] = {signature: $sig, url: $url}
              ' latest.json > latest.json.new
            else
              # No manifest from tauri-action -> emit a darwin-only one so macOS
              # still updates (a windows-updater gap would need separate triage).
              jq -n --arg v "${TAG#v}" --arg url "$URL" --arg sig "$MAC_SIG" '
                {version: $v, notes: "", pub_date: (now | todate),
                 platforms: {
                   "darwin-aarch64": {signature: $sig, url: $url},
                   "darwin-x86_64":  {signature: $sig, url: $url}}}
              ' > latest.json.new
            fi
            mv latest.json.new latest.json
            gh release upload "$TAG" --repo "$REPO" latest.json --clobber
            echo "latest.json updated with the macOS updater entry."
          else
            echo "::warning::No macOS updater signature on $TAG — publishing without a darwin entry; macOS auto-update is unavailable this release."
          fi

          # Flip the draft to a published, marked-latest release. Only now does
          # the updater endpoint (releases/latest/download/latest.json) resolve.
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Published $TAG."
