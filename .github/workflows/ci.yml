name: ci

# Test + lint gate for every PR and for pushes to the long-lived branches.
#
# Rust runs in three lanes:
#   - `rust-linux` (ubuntu): the FAST lane, runs on every branch. Covers all
#     cross-platform code. macOS-only `#[cfg(target_os = "macos")]` code is
#     compiled out here.
#   - `rust-macos` (macOS): the SLOW lane (~15-20 min), gated to release-bound
#     merges (PRs into staging/beta/main + pushes to them). Covers the macOS-only
#     code (security-scoped bookmarks, App Translocation, apple-native keychain).
#   - `rust-windows` (windows): clippy (deny warnings) and the capture unit
#     tests, gated to staging/beta/main like rust-macos, plus ANY PR that touches
#     `src-tauri/src/capture/**` (screen capture carries the most `cfg(windows)`
#     code, and no other lane compiles it). It exists because ONLY the release
#     (publish) workflow ever built on Windows, so Windows-specific breakage
#     (e.g. a `#[cfg(unix)]` module referenced unconditionally in
#     `generate_handler!`) surfaced at release time instead of at PR time.
#
# Screen capture also gets two RUNTIME jobs, `capture-runtime-windows` and
# `capture-runtime-linux`: the built app binary run as the recorder child on
# a real Windows and a real Linux (Xvfb + a PulseAudio null sink), recording
# through the real encoders and read back. PR-only, path-gated to what can
# change the child (`changes.outputs.capture_runtime`), and never required:
# they depend on what a hosted runner happens to offer (a desktop, Media
# Foundation), and report a missing one as a warning.
#
# All THREE long-lived branches cut releases — `staging` (tauri-staging.yml),
# `beta` (tauri-beta.yml) and `main` (tauri-build.yml) — so the macOS and Windows
# lanes gate all three. Under the old `redesign`/`dev` layout they gated neither,
# which is how a Windows-only compile break reached a release. `beta` was missed
# when that lane was created: it publishes to real users, yet a PR into it ran
# neither lane — and neither could be made a required check without hanging
# every such PR on a job that never starts.
#
# Branch protection requires `rust-linux` + `rust-macos` + `frontend` on
# staging/main. `rust-windows` is a NON-required lane; make it required once it
# has run green on a staging PR (branch-protection is an admin change).
on:
  pull_request:
  push:
    branches: [main, staging]

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Which areas does this PR actually touch? Pure path gate for the Rust jobs
  # below: a frontend-only PR compiles no Rust at all (rust-linux alone was
  # ~18 min, rust-macos up to ~50 min cold — all spent re-checking code the
  # PR did not change). Inline `git diff` rather than a third-party action,
  # matching the repo's no-third-party preference in rust-ci-setup. Pushes to
  # the long-lived branches skip the gate entirely so every lane keeps full
  # post-merge coverage.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      capture: ${{ steps.diff.outputs.capture }}
      capture_runtime: ${{ steps.diff.outputs.capture_runtime }}
      capture_helper: ${{ steps.diff.outputs.capture_helper }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Full history so the PR base sha is present to diff against.
          fetch-depth: 0

      - name: Detect changed areas
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            # The capture runtime jobs are PR evidence only (see their
            # comment); a push already ran them on its PR.
            {
              echo "rust=true"
              echo "capture=true"
              echo "capture_runtime=false"
              echo "capture_helper=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Screen capture is where most `cfg(windows)` code lives; a PR that
          # touches it gets the Windows lane whatever its base.
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^src-tauri/src/capture/'; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi
          # The capture runtime jobs run the built recorder child, so they
          # follow what can change it: capture's code, the entry point that
          # branches into the child, the dependency graph, the runtime test,
          # its script, and this pipeline and its setup action.
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(src-tauri/src/capture/|src-tauri/src/(main|cli)\.rs$|src-tauri/Cargo\.(toml|lock)$|src-tauri/tests/capture_recorder_runtime\.rs$|scripts/capture-runtime-check\.sh$|\.github/workflows/ci\.yml$|\.github/actions/rust-ci-setup/)'; then
            echo "capture_runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "capture_runtime=false" >> "$GITHUB_OUTPUT"
          fi
          # The macOS recording helper is built only by the release workflows,
          # so its own job follows the Swift package, its build script and
          # this pipeline.
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(macos/HippiusCapture/|macos/build-capture-helper\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "capture_helper=true" >> "$GITHUB_OUTPUT"
          else
            echo "capture_helper=false" >> "$GITHUB_OUTPUT"
          fi
          # Anything under src-tauri/ (the crate), .github/ (this pipeline and
          # its composite actions), or scripts/ (steps the jobs shell out to)
          # can change what the Rust jobs verify; everything else cannot.
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(src-tauri/|\.github/|scripts/)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  release-deps-linux:
    # The release builds install their system packages on ubuntu-22.04 (the
    # older glibc they ship against), which no other job uses. A package that
    # cannot install there failed the staging release after merge, so the
    # install runs here first. Same script the release workflows run.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install the Linux release build's packages
        run: bash scripts/install-linux-release-deps.sh

  capture-helper-macos:
    # The screen-recording helper (Swift) is built only by the release
    # workflows, so a helper that does not compile used to surface as a
    # failed release after merge. Same build the release runs (universal).
    needs: changes
    if: needs.changes.outputs.capture_helper == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Build the screen-recording helper
        run: bash macos/build-capture-helper.sh --universal

  rust-linux:
    needs: changes
    # Skipped when the PR touches no Rust-relevant path (frontend-only PRs).
    # Pushes always run.
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No step pushes or reuses the GITHUB_TOKEN; the private hcfs dep is
          # fetched over a separate SSH key. Don't leave the token in .git/config.
          persist-credentials: false

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          deploy-key: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
          tauri-env: ${{ secrets.TAURI_ENV_FILE }}
          linux-deps: "true"

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo test

      # Linux X11 screenshots against a real X server: the displays RandR
      # lists and a grab of the root window (capture::linux_x11). Xvfb has
      # RandR; the test is #[ignore]d so a plain `cargo test` stays hermetic.
      - name: X11 capture under Xvfb
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a cargo test --lib capture::linux_x11 -- --ignored

      # Linux recording's real writer: the recorder child's GStreamer
      # pipeline fed the synthetic source with a pause, read back (5 s, one
      # H.264 and one AAC track), and a writer killed with SIGKILL whose
      # fragments must still play (capture::recorder_child::linux::self_test).
      - name: Linux recorder against GStreamer
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: |
          sudo apt-get install -y --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          cargo test --lib capture::recorder_child::linux -- --ignored --test-threads=1

  rust-macos:
    # The macOS lane is the slow one (up to ~50 min cold), so run it only on
    # PROMOTION PRs (into beta/main) and on pushes to the three lane branches.
    # Ordinary feature PRs target staging and rely on `rust-linux`; the push to
    # staging after merge is the macOS backstop, and it lands before anything
    # can promote toward users. It exists to cover the macOS-only code the
    # Linux lane compiles out. Like rust-windows, it also runs for any PR that
    # touches `src-tauri/src/capture/**` (`changes.outputs.capture`): capture
    # carries the most macOS-only code, and a macOS failure found only on the
    # promotion PR holds the whole release back.
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'beta' || github.base_ref == 'main') && needs.changes.outputs.rust == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.capture == 'true') ||
      (github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'beta' || github.ref_name == 'main'))
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          deploy-key: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
          tauri-env: ${{ secrets.TAURI_ENV_FILE }}

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo test

  rust-windows:
    # Windows compile lane. Only the publish (release) workflow builds on Windows,
    # so a Windows-only compile break (a `#[cfg(unix)]` module referenced
    # unconditionally in `generate_handler!`) failed at release time, not PR time.
    # Clippy with -D warnings over every target (the test code's `cfg(windows)`
    # arms included) and the capture unit tests catch it. Gated to promotion PRs
    # and lane pushes like rust-macos so ordinary feature PRs stay quick, except
    # a PR touching `src-tauri/src/capture/**`, which runs here on any base
    # (`changes.outputs.capture`): capture carries the most Windows-only code. The shared rust-ci-setup composite is
    # Linux/macOS-oriented (ssh-agent, apt), so this job mirrors the PROVEN
    # Windows setup from tauri-build.yml: an ~/.ssh/config IdentityFile (no
    # ssh-agent) + git-CLI fetch for the private hcfs dep.
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'beta' || github.base_ref == 'main') && needs.changes.outputs.rust == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.capture == 'true') ||
      (github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'beta' || github.ref_name == 'main'))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Private hcfs git deps over SSH. Git Bash on windows-latest provides bash +
      # python3 + ssh-keyscan; the IdentityFile config (no ssh-agent) is the same
      # approach the release workflow's Windows leg uses successfully.
      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()))
          PY
          chmod 600 ~/.ssh/private_git_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Force Cargo to use the git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > ~/.cargo/config.toml

      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the channel; install it so `cargo` uses the
          # same compiler the app ships with.
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)
          echo "pinned channel: ${channel:-<none, using default>}"
          if [[ -n "$channel" ]]; then
            rustup toolchain install "$channel" --no-self-update
          fi

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          # One cache family per OS instead of one per job: the repo cache is
          # capped at 10 GB, and separate per-job families evicted each other,
          # which is how promotion PRs kept hitting cold ~50 min builds.
          shared-key: "ci"
          cache-on-failure: "true"

      # tauri-build requires the frontendDist dir (../out) to exist; the check
      # never serves the frontend, so a placeholder satisfies the build script.
      - name: Placeholder frontend dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf '<!doctype html><title>ci</title>' > out/index.html

      - name: Create src-tauri/.env
        shell: bash
        env:
          TAURI_ENV_FILE: ${{ secrets.TAURI_ENV_FILE }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          printf '%s\n' "$TAURI_ENV_FILE" > src-tauri/.env

      - name: Clippy (Windows, deny warnings)
        working-directory: src-tauri
        shell: bash
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings

      # The capture unit tests: the recorder protocol and child loop, the
      # rollout table, sizing and timeline, shortcut refusals. Windows-only
      # arms (the OS build floor, the Windows shortcut list) run nowhere else.
      - name: Capture tests (Windows)
        working-directory: src-tauri
        shell: bash
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --lib "capture::"

  capture-runtime-windows:
    # Screen capture's Windows code RUN on a real Windows, not just compiled:
    # the built app binary as the recorder child (`--capture-recorder`) with
    # each of its modes, the self-test through the real Media Foundation
    # writer, a WGC recording of the runner's desktop with a pause, read back
    # with ffprobe and the child's own `--poster`, and an xcap screenshot
    # (src-tauri/tests/capture_recorder_runtime.rs, run by
    # scripts/capture-runtime-check.sh).
    #
    # PR-only and path-gated (`changes.outputs.capture_runtime`): it costs a
    # Windows build, and only capture, the child's entry point, the
    # dependency graph or this pipeline can change what it proves. NOT a
    # required check, and must not become one: a hosted runner's desktop and
    # Media Foundation are outside this repo's control, and a skipped job
    # must never hang an unrelated PR. A runner limit (no Media Foundation
    # encoders, no interactive desktop) is a workflow WARNING, not a failure;
    # anything the job installs being missing is a failure.
    #
    # Setup mirrors rust-windows (the IdentityFile SSH config, the git CLI,
    # the pinned toolchain, the shared cache) but never SAVES the cache: this
    # job builds only part of the crate, and the cache is shared per OS.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.capture_runtime == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()))
          PY
          chmod 600 ~/.ssh/private_git_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Force Cargo to use the git CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cargo
          printf '[net]\ngit-fetch-with-cli = true\n' > ~/.cargo/config.toml

      - name: Install the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' src-tauri/rust-toolchain.toml)
          echo "pinned channel: ${channel:-<none, using default>}"
          if [[ -n "$channel" ]]; then
            rustup toolchain install "$channel" --no-self-update
          fi

      - name: Rust cache (restore only)
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: "ci"
          save-if: "false"

      - name: Placeholder frontend dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          printf '<!doctype html><title>ci</title>' > out/index.html

      - name: Create src-tauri/.env
        shell: bash
        env:
          TAURI_ENV_FILE: ${{ secrets.TAURI_ENV_FILE }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          printf '%s\n' "$TAURI_ENV_FILE" > src-tauri/.env

      # Windows Server ships Media Foundation's H.264 and AAC encoders only
      # with the Server Media Foundation feature. Report what this runner has
      # and add the feature when it is missing; if adding it needs a reboot
      # (a hosted runner cannot), the recording checks report "Media
      # Foundation unavailable" as a warning. `--probe` is the final word:
      # the tests ask it, not this step.
      - name: Media Foundation and desktop session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "Windows: $($os.Caption) build $($os.BuildNumber)"
          Write-Output "session id: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive: $([Environment]::UserInteractive)"
          if (Get-Process explorer -ErrorAction SilentlyContinue) { Write-Output 'explorer.exe is running (a desktop shell)' } else { Write-Output '::warning title=No desktop shell::explorer.exe is not running; WGC may have no desktop to capture' }
          $mf = $null
          try { $mf = Get-WindowsFeature -Name Server-Media-Foundation -ErrorAction Stop } catch { Write-Output "Get-WindowsFeature unavailable (not Windows Server?): $_" }
          if ($null -eq $mf) {
            Write-Output 'Server-Media-Foundation: not applicable'
          } elseif ($mf.Installed) {
            Write-Output 'Server-Media-Foundation: installed'
          } else {
            Write-Output 'Server-Media-Foundation: missing, installing'
            try {
              $result = Install-WindowsFeature -Name Server-Media-Foundation -ErrorAction Stop
              Write-Output "install: success=$($result.Success) restart=$($result.RestartNeeded)"
              if ("$($result.RestartNeeded)" -eq 'Yes') {
                Write-Output '::warning title=Media Foundation needs a reboot::Server-Media-Foundation was installed but needs a restart a hosted runner cannot do; the encoder checks will report it'
              }
            } catch {
              Write-Output "::warning title=Media Foundation unavailable::Install-WindowsFeature Server-Media-Foundation failed: $_"
            }
          }

      # ffprobe reads the recording's tracks back independently of the
      # Media Foundation reader the app uses.
      - name: Install ffprobe
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then
            choco install ffmpeg -y --no-progress
          fi
          ffprobe -version | head -1

      - name: Build the app binary and the runtime test
        working-directory: src-tauri
        shell: bash
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --test capture_recorder_runtime --no-run

      - name: Capture runtime checks (Windows)
        shell: bash
        env:
          SQLX_OFFLINE: "true"
          HIPPIUS_CAPTURE_RUNTIME_REQUIRE: "1"
          CAPTURE_RUNTIME_MIN_TESTS: "8"
        run: bash scripts/capture-runtime-check.sh

  capture-runtime-linux:
    # Screen capture's Linux code RUN, not just compiled, on an X11 session
    # (Xvfb) with a PulseAudio null sink as the sound: the built app binary
    # as the recorder child with each of its modes, the self-test through
    # the real GStreamer writer, a 3 s `ximagesrc` recording of the Xvfb
    # display with the microphone and system audio (both the null sink's
    # monitor) and a pause, validated with ffprobe (one H.264 track, one AAC
    # track, about 3 s) and the child's own `--poster`, the meter printing
    # levels, and an X11 screenshot (src-tauri/tests/capture_recorder_runtime.rs,
    # run by scripts/capture-runtime-check.sh). rust-linux keeps running the
    # unit-level ignored tests (the killed-writer file, the RandR listing).
    #
    # Wayland (the ScreenCast portal and PipeWire) cannot run headless with a
    # portal backend that answers without a person, so it stays manual: the
    # plan's Linux checklist.
    #
    # Same gating and the same "never required, never saves the cache" rules
    # as capture-runtime-windows.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.capture_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          deploy-key: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
          tauri-env: ${{ secrets.TAURI_ENV_FILE }}
          linux-deps: "true"
          save-cache: "false"

      - name: Install GStreamer plugins, Xvfb, PulseAudio and ffprobe
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pipewire \
            gstreamer1.0-pulseaudio gstreamer1.0-tools \
            xvfb xauth pulseaudio pulseaudio-utils ffmpeg

      - name: Build the app binary and the runtime test
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --test capture_recorder_runtime --no-run

      # A null sink is the default output, and its monitor the default input:
      # the recorder's microphone (`pulsesrc`, default source) and system
      # audio (`@DEFAULT_MONITOR@`) both open, and the meter has a source. A
      # quiet tone plays into the sink so the track is not silence.
      - name: Start PulseAudio with a null sink
        run: |
          set -euo pipefail
          if [[ -z "${XDG_RUNTIME_DIR:-}" || ! -w "${XDG_RUNTIME_DIR:-/nonexistent}" ]]; then
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          fi
          export XDG_RUNTIME_DIR
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null sink_properties=device.description=CI-null
          pactl set-default-sink ci_null
          pactl set-default-source ci_null.monitor
          pactl info | grep -E 'Server Name|Default Sink|Default Source'
          nohup gst-launch-1.0 -q audiotestsrc is-live=true volume=0.2 ! audioconvert ! audioresample ! pulsesink > "$RUNNER_TEMP/tone.log" 2>&1 &
          sleep 1
          for element in ximagesrc pulsesrc x264enc avenc_aac mp4mux avdec_h264; do
            gst-inspect-1.0 "$element" > /dev/null || { echo "::error::GStreamer element $element is missing"; exit 1; }
          done

      - name: Capture runtime checks (Linux, X11 under Xvfb)
        env:
          SQLX_OFFLINE: "true"
          HIPPIUS_CAPTURE_RUNTIME_REQUIRE: "1"
          HIPPIUS_CAPTURE_RUNTIME_AUDIO: "1"
          CAPTURE_RUNTIME_MIN_TESTS: "8"
        run: xvfb-run -a -s "-screen 0 1280x720x24" bash scripts/capture-runtime-check.sh

  windows-shell-ext:
    # Compile + test the standalone IExplorerCommand COM DLL crate
    # (windows/HippiusShell) on Windows. It can't build on the author's macOS
    # host (windows-crate COM), and the app's rust-windows lane only checks
    # src-tauri (not this separate crate). No private deps, so no SSH key needed.
    # Same gating as rust-windows.
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'beta' || github.base_ref == 'main')) ||
      (github.event_name == 'push' && (github.ref_name == 'staging' || github.ref_name == 'beta' || github.ref_name == 'main'))
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './windows/HippiusShell -> target'
          cache-on-failure: "true"

      - name: Build + test the shell extension
        working-directory: windows/HippiusShell
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          cargo test

      # Validate the full packaging pipeline (build DLL -> self-signed cert ->
      # stamp manifest -> makeappx pack -> signtool sign/verify -> export cert)
      # here in the fast lane, before wiring it into the slow preview build.
      - name: Package sparse MSIX (self-signed)
        working-directory: windows/HippiusShell
        shell: pwsh
        run: ./package-selfsigned.ps1

  supply-chain:
    # Supply-chain advisory gate for the Rust backend. Lighter than the Rust
    # build jobs — it skips the toolchain, build cache and compile — but it
    # still needs the HCFS deploy key: cargo-deny builds the dependency graph
    # via `cargo metadata`, which resolves EVERY source, including the private
    # hcfs git dep over SSH. Without the key the graph can't resolve and the
    # gate errors out before it ever reaches the advisory check. Scoped to
    # `advisories bans sources` (the security-relevant checks); `licenses` is
    # configured in deny.toml but not yet enforced — see the [licenses] note
    # there for the sign-off it's blocked on.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # cargo metadata fetches the private hcfs-client/hcfs-shared git deps over
      # SSH. Mirrors the rust-ci-setup composite's key step; the agent vars are
      # exported to GITHUB_ENV so the cargo-deny step (a separate step) inherits
      # the loaded key.
      - name: Setup SSH for private Rust git deps
        shell: bash
        env:
          PRIVATE_GIT_DEPLOY_KEY_B64: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 - <<'PY' > ~/.ssh/private_git_key
          import os, base64, sys
          sys.stdout.buffer.write(base64.b64decode(os.environ["PRIVATE_GIT_DEPLOY_KEY_B64"].strip()))
          PY
          chmod 600 ~/.ssh/private_git_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/private_git_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/private_git_key

      - name: Install cargo-deny
        uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2.82.3
        with:
          tool: cargo-deny

      - name: cargo-deny (advisories, bans, sources)
        working-directory: src-tauri
        run: cargo deny check advisories bans sources

  rust-fmt:
    # Formatting gate. Without it the backend silently drifts from its own
    # rustfmt.toml (max_width = 150) — it had accumulated 66 files of drift
    # before this job existed, which made `cargo fmt` unusable: running it on
    # ONE file rewrote dozens of unrelated ones, because rustfmt walks the whole
    # module tree from the crate root. Keeping the tree clean keeps `cargo fmt`
    # safe to run on a single file.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Only rustfmt is needed — no crate compilation, so this deliberately
      # skips the full rust-ci-setup (SSH keys, sqlx, caches) and stays fast.
      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

  actionlint:
    # Lint the workflow files themselves so a malformed/insecure workflow fails
    # CI instead of only failing at run time. actionlint also runs shellcheck on
    # every `run:` script (the ubuntu runner ships shellcheck), which is what
    # catches the unquoted-`$GITHUB_ENV` SC2086 class. Workflow SECURITY (vs
    # correctness) is gated separately by the `zizmor` job below.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # actionlint is a Go binary, not a crate, so taiki-e/install-action can't
      # provide it (it fell back to cargo-binstall and errored). Install the
      # pinned release tarball and verify its SHA256 — transparent, no curl|bash.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint

      - name: Lint workflows
        run: ./actionlint -color

  shellcheck:
    # actionlint above shellchecks inline `run:` blocks only. These scripts are
    # standalone files, so nothing linted them — and three of them now gate every
    # release: macos/verify-macos-artifacts.sh and scripts/verify-release-manifest.sh
    # are what stand between a bad macOS build and the fleet, and they run
    # nowhere except on a release push, where a typo is discovered by the release
    # failing. `-x` traces the resolved paths.
    #
    # The ubuntu runner ships shellcheck, so unlike actionlint and zizmor there
    # is no binary to fetch or pin here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -x scripts/*.sh macos/*.sh

  zizmor:
    # Security audit of the workflow files (credential persistence, cache
    # poisoning of privileged/signed builds, template injection, …). Run
    # `--offline` so the gate is hermetic — no GITHUB_TOKEN or network — and
    # pinned by SHA256 like actionlint. The single accepted finding (an uncached
    # setup-node in the release workflow) is justified inline with a
    # `# zizmor: ignore[cache-poisoning]` comment.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install zizmor
        shell: bash
        run: |
          set -euo pipefail
          version=1.26.1
          sha256=8556289a64e7aaf2400cd516f61a471aa91c5902cc56ad96a82fd12f90c2ef73
          curl -fsSL -o zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${version}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${sha256}  zizmor.tar.gz" | sha256sum -c -
          tar xzf zizmor.tar.gz zizmor

      - name: Audit workflows
        run: ./zizmor --offline --persona regular .github/workflows/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: PNPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Informational, NOT blocking (continue-on-error). Scoped to --prod so it
      # reports only advisories in dependencies that actually ship in the
      # desktop bundle (dev tooling — eslint/wdio/mocha/vitest — never reaches a
      # user and is excluded). It is non-blocking for now because the shipped
      # tree carries a pre-existing backlog the gate can't fix in place — most
      # notably a CRITICAL prototype-pollution advisory in swiper@11 (fixed only
      # in the 12.x major, which needs an API migration + UI validation). Ratchet
      # this to a blocking `--audit-level=high` once that backlog is cleared.
      - name: Audit prod dependencies (informational)
        run: pnpm audit --prod --audit-level=moderate
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      # `pnpm lint` (eslint) does NOT type-check. Without this a wrong IPC
      # return shape consumed in TS merges green and only surfaces at release
      # build time (`next build`), which runs on tags, never on PRs. This is the
      # cheap gate for the FE↔Rust boundary the audit flagged.
      - name: Typecheck
        run: pnpm typecheck

      # Run WITH coverage so the per-scope ratcheted thresholds in
      # vitest.config.ts actually gate — `pnpm test` (no --coverage) collects no
      # coverage and would silently skip the floors. A drop below a logic-scope
      # floor (lib/utils, lib/upload-feed, lib/tray, lib/hooks) fails here.
      - name: Tests (with coverage thresholds)
        run: pnpm test:coverage
