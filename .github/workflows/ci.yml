name: ci

# Test + lint gate for every PR and for pushes to the long-lived branches.
#
# Rust runs in two lanes that share `.github/actions/rust-ci-setup`:
#   - `rust-linux` (ubuntu): the FAST lane, runs on every branch incl. redesign.
#     Covers all cross-platform code. macOS-only `#[cfg(target_os = "macos")]`
#     code is compiled out here.
#   - `rust-macos` (macOS): the SLOW lane (~15-20 min), gated to release-bound
#     merges (PRs into dev/main + pushes to them). Covers the macOS-only code
#     (security-scoped bookmarks, App Translocation, apple-native keychain).
# Branch protection requires `rust-linux` + `frontend` on redesign, and
# `rust-linux` + `rust-macos` + `frontend` on dev/main.
on:
  pull_request:
  push:
    branches: [main, dev, redesign]

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No step pushes or reuses the GITHUB_TOKEN; the private hcfs dep is
          # fetched over a separate SSH key. Don't leave the token in .git/config.
          persist-credentials: false

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          deploy-key: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
          tauri-env: ${{ secrets.TAURI_ENV_FILE }}
          linux-deps: "true"

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo test

  rust-macos:
    # The macOS lane is the slow one (~15-20 min cold), so run it only where it
    # gates a release-bound merge — PRs into dev/main and pushes to them — and
    # skip it on redesign. It exists to cover the macOS-only code the Linux lane
    # compiles out; `rust-linux` is the everywhere gate.
    if: >-
      (github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main')) ||
      (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main'))
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Rust CI setup
        uses: ./.github/actions/rust-ci-setup
        with:
          deploy-key: ${{ secrets.HCFS_DEPLOY_KEY_B64 }}
          tauri-env: ${{ secrets.TAURI_ENV_FILE }}

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        env:
          SQLX_OFFLINE: "true"
        run: cargo test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup PNPM
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: 9.12.3
          run_install: false

      - name: PNPM store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: PNPM cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test
