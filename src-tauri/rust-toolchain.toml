# Pin the toolchain so clippy/rustc results are reproducible. CI uses
# dtolnay/rust-toolchain@stable, whose lint surface drifts with every release;
# without a pin a new clippy can fail a build that was clean the day before
# (which is exactly how the 1.95 lints accumulated). Bump deliberately, then
# fix any new lints in the same change.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
