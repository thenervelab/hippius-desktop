[package]
name = "Hippius"
version = "0.1.100"
description = "Hippius Desktop App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "protocol-asset",
    'tray-icon',
    'image-ico',
    'image-png',
    # Required for the transparent tray-panel popover window
    # (`macOSPrivateApi: true` in tauri.conf.json). Enables the private
    # macOS APIs Tauri uses to render a borderless, see-through webview.
    'macos-private-api',
    # Enable devtools even in release builds so we can debug OAuth/recovery
    # without rebuilding a debug DMG. Gated at runtime via the HIPPIUS_DEVTOOLS
    # env var — see `main.rs` setup hook. Remove once we stop shipping dev
    # aids in release.
    'devtools',
] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
] }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio-util = "0.7"
dirs = "6.0.0"
flate2 = "1.1.2"
tar = { version = "0.4.44", default-features = false }
reqwest = { version = "0.13.1", default-features = false, features = [
    "multipart",
    "json",
    "stream",
    "rustls",
] }
ed25519-dalek = "2.2"
zip = { version = "4.2.0", default-features = false, features = ["deflate", "aes-crypto"] }
dotenvy = "0.15"
base64 = "0.22"
sha2 = "0.10"
subxt = "0.38"
subxt-signer = { version = "0.38", default-features = false, features = ["sr25519", "subxt", "std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
hex = "0.4"
tauri-plugin-fs = "2"
sysinfo = "0.32"
notify = "6.1"
tauri-plugin-dialog = "2.6.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.8"
tauri-plugin-process = "2"
which = "4.4"
hostname = "0.4"
zeroize = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
bip39 = { version = "2.2", features = ["rand"] }
zxcvbn = { version = "3", default-features = false }
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
alloy-signer = { version = "0.8", default-features = false }
alloy-signer-local = { version = "0.8", default-features = false, features = [
    "mnemonic",
] }
hcfs-client = { git = "ssh://git@github.com/thenervelab/hcfs.git", rev = "f72bddb3b95d9cfe5c114686445e86aacd8adeb4" }
# hcfs-shared pulls in the `network` module types (RegisterRelativePathEntry,
# MAX_REGISTER_RELATIVE_PATHS_BATCH, ...) that hcfs-client takes/returns on
# its public API but does not re-export. Pinned to the same git rev so the
# wire types stay in lockstep with the client.
hcfs-shared = { git = "ssh://git@github.com/thenervelab/hcfs.git", rev = "f72bddb3b95d9cfe5c114686445e86aacd8adeb4" }
# NFC-normalise relative_path strings before posting them to the server's
# register_relative_paths endpoint. macOS APFS hands filenames back in NFD
# and the server's path_validator hard-rejects anything non-NFC — see the
# docstring on `path_index_to_entries` in sync/relative_path_backfill.rs for
# the full story. Version pinned to match hcfs-server and hcfs-client.
unicode-normalization = "0.1"
# Lightweight MIME-type sniff from path/extension. Used by the
# file-sharing flow so the recipient page can pick a sensible
# Content-Disposition + preview mode without re-implementing a
# magic-byte sniffer in the desktop. The crate has no transitive
# deps beyond `unicase` and is what hcfs-server itself uses.
mime_guess = "2.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily rolling-file log appender so the app's tracing output lands on disk
# (~/.hippius/logs/) and can be bundled into support tickets. Pairs with
# tracing-subscriber's non-blocking writer + WorkerGuard.
tracing-appender = "0.2"
# Pattern-based redaction of secrets (mnemonics, auth tokens, private keys)
# from log text before it is zipped and uploaded with a support ticket.
regex = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
] }
# Ergonomic Error Handling
anyhow = "1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Phase 6 will tighten these to "warn" after migrating to AppError
unwrap_used = "allow"
expect_used = "allow"
# Phase 6 will tighten to "deny" after all #[allow] are converted to #[expect]
allow_attributes = "allow"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
# Tauri commands take String by value (IPC deserialization); fixing is not practical
needless_pass_by_value = "allow"
# Tauri commands must return Result for IPC even when infallible
unnecessary_wraps = "allow"
# Tauri command handlers are async for the framework even without await
unused_async = "allow"
# Numeric casts are pervasive in chart/blockchain code; case-by-case review in Phase 6
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Common pattern in this codebase; not confusing
items_after_statements = "allow"
# Raw string hashes are auto-generated by macros
needless_raw_string_hashes = "allow"

[dev-dependencies]
# `tauri` is also listed as a normal dependency above; the dev-deps entry
# adds the `test` feature so unit tests in `src-tauri/src/sync/` can
# build an `AppHandle<MockRuntime>` via `tauri::test::mock_app()` without
# spinning up a real Wry runtime. Cargo merges features per build kind:
# tests get `test` enabled, production binaries don't. The `test` feature
# is a pure gate (`test = []` in tauri's Cargo.toml) so it adds no
# transitive deps to either build. Required for in-module tests of
# callbacks like `build_file_synced_callback` whose signature now takes
# `&AppHandle<R>`.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "process",
    "test-util",
] }
anyhow = "1"
aes = "0.8"
cbc = "0.1"
md5 = "0.7"
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "rustls",
] }
tempfile = "3"
proptest = "1"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
