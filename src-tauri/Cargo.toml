[package]
name = "Hippius"
version = "0.2.1"
description = "Hippius Desktop App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# E2E ONLY — must NEVER be enabled in a release/production build. Turns on the
# `tauri-plugin-webdriver` in-process WebDriver automation server registered in
# `main.rs`, which exposes UNAUTHENTICATED automation over localhost HTTP (the
# crate's own README: "Never include it in production builds"). It is off by
# default and `tauri build` enables no features, so a normal release can never
# pull it into the dependency graph. Driven by the WebdriverIO smoke suite in
# `e2e/` — build with `--features e2e-webdriver`. The `dep:` prefix keeps the
# optional crate from implicitly minting a same-named feature
# (axiom rust_quality_121 — feature-matrix hygiene).
e2e-webdriver = ["dep:tauri-plugin-webdriver"]

# App-scoped NetBird VPN for VM connections. OFF by default so normal builds and
# CI pull NO Go toolchain / cgo / ~50MB embedded library, and the disabled
# engine (`vpn::engine::DisabledEngine`) reports `UnsupportedBuild`. Enabling it
# pulls `netbird-embed`, whose `build.rs` compiles a Go c-shared library
# (NetBird `client/embed` + wireguard-go) — so a `--features netbird-vpn` build
# REQUIRES a Go (>=1.25) toolchain + cgo. The `dep:` prefix keeps the optional
# crate from implicitly minting a same-named feature (axiom rust_quality_121).
# See docs/plans/2026-06-29-netbird-vpn-vm-connections.md.
netbird-vpn = ["dep:netbird-embed"]

[dependencies]
tauri = { version = "2", features = [
    "protocol-asset",
    'tray-icon',
    'image-ico',
    'image-png',
    # Required for the transparent tray-panel popover window
    # (`macOSPrivateApi: true` in tauri.conf.json). Enables the private
    # macOS APIs Tauri uses to render a borderless, see-through webview.
    'macos-private-api',
    # Enable devtools even in release builds so we can debug OAuth/recovery
    # without rebuilding a debug DMG. Gated at runtime via the HIPPIUS_DEVTOOLS
    # env var — see `main.rs` setup hook. Remove once we stop shipping dev
    # aids in release.
    'devtools',
] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2.0.0"
tauri-plugin-shell = "2"
# Optional, dev/E2E-only: embeds an in-process W3C WebDriver server so
# WebdriverIO/Selenium can drive a REAL macOS WKWebView build (the official
# `tauri-driver` can't — Apple ships no WKWebView driver). Pinned exact because
# it is a young, pre-1.0, unofficial crate that injects an automation server;
# only ever compiled under the off-by-default `e2e-webdriver` feature. See the
# `[features]` note above.
tauri-plugin-webdriver = { version = "=0.2.1", optional = true }
# Embedded NetBird userspace mesh client — see the `netbird-vpn` feature note
# above. Optional + gated so default/CI builds never invoke its Go/cgo build.rs.
netbird-embed = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.49.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    # Unix-domain socket for the Finder extension bridge (src/finder_bridge).
    "net",
] }
futures-util = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio-util = "0.7"
dirs = "6.0.0"
flate2 = "1.1.2"
tar = { version = "0.4.44", default-features = false }
reqwest = { version = "0.13.1", default-features = false, features = [
    "multipart",
    "json",
    "stream",
    "rustls",
] }
ed25519-dalek = "2.2"
zip = { version = "4.2.0", default-features = false, features = ["deflate", "aes-crypto"] }
dotenvy = "0.15"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"
subxt = "0.38"
subxt-signer = { version = "0.38", default-features = false, features = ["sr25519", "subxt", "std"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
hex = "0.4"
tauri-plugin-fs = "2"
sysinfo = "0.32"
notify = "6.1"
tauri-plugin-dialog = "2.6.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = "0.8"
tauri-plugin-process = "2"
which = "4.4"
hostname = "0.4"
zeroize = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
bip39 = { version = "2.2", features = ["rand"] }
zxcvbn = { version = "3", default-features = false }
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
alloy-signer = { version = "0.8", default-features = false }
alloy-signer-local = { version = "0.8", default-features = false, features = [
    "mnemonic",
] }
# Pinned to the merged hcfs main rev (PR #278) that teaches `stage_with_paths`
# the display-path ladder `drive/download.rs` already used — path_index, then
# the server's encrypted path blob decrypted with the folder key, then the
# legacy basename. Without it a staged plan named remote-only files by a hex
# FileId, so the "Review Changes" dialog asked users to confirm deleting
# 64-char hashes. Carries forward PR #277's `Manifest.source = "desktop"` stamp
# on every upload hcfs-client builds, which is what feeds hcfs-server's
# per-source storage breakdown (`GET /get_source_summary`) — no desktop code
# declares it, because every upload here goes through hcfs-client's own sync
# engine. Bumping this rev is the only way a hcfs change reaches the desktop,
# so it stays exact and is guarded by the wire-contract pins in
# tests/hcfs_contract.rs.
hcfs-client = { git = "ssh://git@github.com/thenervelab/hcfs.git", rev = "2e33c2a55bd2bcf706caa646c420a24ee5ab1a65" }
# hcfs-shared pulls in the `network` module types (RegisterRelativePathEntry,
# MAX_REGISTER_RELATIVE_PATHS_BATCH, ...) that hcfs-client takes/returns on
# its public API but does not re-export. Pinned to the same git rev so the
# wire types stay in lockstep with the client.
hcfs-shared = { git = "ssh://git@github.com/thenervelab/hcfs.git", rev = "2e33c2a55bd2bcf706caa646c420a24ee5ab1a65" }
# NFC-normalise relative_path strings before posting them to the server's
# register_relative_paths endpoint. macOS APFS hands filenames back in NFD
# and the server's path_validator hard-rejects anything non-NFC — see the
# docstring on `path_index_to_entries` in sync/relative_path_backfill.rs for
# the full story. Version pinned to match hcfs-server and hcfs-client.
unicode-normalization = "0.1"
# Lightweight MIME-type sniff from path/extension. Used by the
# file-sharing flow so the recipient page can pick a sensible
# Content-Disposition + preview mode without re-implementing a
# magic-byte sniffer in the desktop. The crate has no transitive
# deps beyond `unicase` and is what hcfs-server itself uses.
mime_guess = "2.0"
# Decode/resize/encode for server-side thumbnail generation (sync/remote.rs).
# Capped below 0.25.9: image 0.25.9 bumped its `jpeg` feature to require
# `zune-core ^0.5.0` / `zune-jpeg ^0.5.5`, and `zune-core 0.5.0` has no STABLE
# release on crates.io yet (only 0.5.0-rc*), so 0.25.9/0.25.10 + `jpeg` are
# currently unbuildable. ≤0.25.8 resolves the published `zune-core 0.4.12`.
# `default-features = false` keeps the heavy/optional decoders (exr, avif, gif,
# tiff) out; jpeg+png+bmp cover the common cloud image types (webp is a
# follow-up — it pulls `image-webp`). Lift the cap once `zune-core 0.5.0` ships.
image = { version = ">=0.25.0, <0.25.9", default-features = false, features = ["jpeg", "png", "bmp"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Daily rolling-file log appender so the app's tracing output lands on disk
# (~/.hippius/logs/) and can be bundled into support tickets. Pairs with
# tracing-subscriber's non-blocking writer + WorkerGuard.
tracing-appender = "0.2"
# Pattern-based redaction of secrets (mnemonics, auth tokens, private keys)
# from log text before it is zipped and uploaded with a support ticket.
regex = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

# Keep the system awake while sync transfers are active (see src/power.rs).
# macOS backend = IOPMAssertionCreateWithName(kIOPMAssertionTypePreventUserIdleSystemSleep);
# Windows backend = SetThreadExecutionState(ES_CONTINUOUS | ES_SYSTEM_REQUIRED).
# Deliberately NOT a Linux dependency: keepawake's Linux backend pulls the zbus
# D-Bus stack for a nice-to-have — power.rs no-ops there for v1. Pinned exact
# (pre-1.0 crate; audit: pure-Rust deps + objc2-io-kit/windows bindings, no
# build.rs downloads — covered by the CI `cargo deny check`).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keepawake = "=0.6.0"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
] }
# Ergonomic Error Handling
anyhow = "1.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Phase 6 will tighten these to "warn" after migrating to AppError
unwrap_used = "allow"
expect_used = "allow"
# Phase 6 will tighten to "deny" after all #[allow] are converted to #[expect]
allow_attributes = "allow"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
# Tauri commands take String by value (IPC deserialization); fixing is not practical
needless_pass_by_value = "allow"
# Tauri commands must return Result for IPC even when infallible
unnecessary_wraps = "allow"
# Tauri command handlers are async for the framework even without await
unused_async = "allow"
# Numeric casts are pervasive in chart/blockchain code; case-by-case review in Phase 6
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# Common pattern in this codebase; not confusing
items_after_statements = "allow"
# Raw string hashes are auto-generated by macros
needless_raw_string_hashes = "allow"

[dev-dependencies]
# `tauri` is also listed as a normal dependency above; the dev-deps entry
# adds the `test` feature so unit tests in `src-tauri/src/sync/` can
# build an `AppHandle<MockRuntime>` via `tauri::test::mock_app()` without
# spinning up a real Wry runtime. Cargo merges features per build kind:
# tests get `test` enabled, production binaries don't. The `test` feature
# is a pure gate (`test = []` in tauri's Cargo.toml) so it adds no
# transitive deps to either build. Required for in-module tests of
# callbacks like `build_file_synced_callback` whose signature now takes
# `&AppHandle<R>`.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "process",
    "test-util",
] }
anyhow = "1"
aes = "0.8"
cbc = "0.1"
md5 = "0.7"
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "rustls",
] }
tempfile = "3"
proptest = "1"
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
