[package]
name = "Hippius"
version = "0.1.86"
description = "Hippius Desktop App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_project_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "protocol-asset",
    'tray-icon',
    'image-ico',
    'image-png',
    'devtools'
    ] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2.0.0" 
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rayon = "1.10"
tokio = { version = "1.45.1", features = ["full"] }
futures = "0.3"
once_cell = "1.21.3"
dirs = "6.0.0"
lazy_static = "1.5.0"
flate2 = "1.1.2"
tar = "0.4.44"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
zip = "4.2.0"
sodiumoxide = "0.2"
base64 = "0.21"
sha2 = "0.10"
subxt = { version = "0.38", features = ["substrate-compat"] }
sp-core = "34.0.0"
reed-solomon-erasure = "6.0.0"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls"] }
hex = "0.4"
parity-scale-codec = "3.6"
tauri-plugin-fs = "2"
sysinfo = "0.32"
notify = "6.1"
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tauri-plugin-process = "2"
fs_extra = "1.3.0"
which = "4.4"
log = "0.4"
aws-config = "1"
aws-sdk-s3 = "1"
hostname = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.0.0", features = ["deep-link"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Directory Traversal
walkdir = "2.5"
# Ergonomic Error Handling
anyhow = "1.0"

# Cargo.toml
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process"] }
anyhow = "1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = "1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
rand = "0.8"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
aws-credential-types = "1"
aws-types = "1"
